  vol: null,
  phase: 0,
  survol: null, selection: null,
  trouves: null,
  replies: {},
  chaudJusqua: 0,
  derniereInteraction: 0,
  /* drill-down récursif : pile de « frames » (une par niveau plongé). Vide =
     vue d'ensemble. `galaxie` est le groupe plongé (racine de la pile). */
  pile: [], galaxie: null, marqueurs: [],
  drillAnim: false, drillT0: 0, drillMix: 1, dernierRemonte: 0, avantPlongee: null,
  /* lecture : fiche actuellement ouverte dans la liseuse */
  ficheLue: null,
  /* recherche : panneau de résultats classés (plein texte) et sélection clavier */
  resultats: null, selResultat: -1,
  /* recherche intra-fiche : occurrences surlignées dans la liseuse */
  lzHits: null, lzHitIdx: -1,
  /* rotation automatique en pause (bascule au clic droit sans glisser) */
  pauseRot: false,
};

var DUREE_TRANS = 680, ETALEMENT = 440, DUREE_VOL = 800;
var ZOOM_MIN = 0.08, ZOOM_MAX = 26;

/* ---------------------------------------------------- réglages persistés */

var CLE = 'brain.univers.v2';

function chargerReglages() {
  var brut;
  try { brut = window.localStorage.getItem(CLE); } catch (e) { return null; }
  if (!brut) return null;
  try { return JSON.parse(brut); } catch (e) { return null; }
}

function enregistrerReglages() {
  var positions = {}, i, n, p;
  for (i = 0; i < noeuds.length; i++) {
    n = noeuds[i];
    if (n.kind === 'fiche' || n.kind === 'hub') {
      p = n.p.force;
      if (p && p.x !== undefined) positions[n.id] = [
        Math.round(p.x * 10) / 10, Math.round(p.y * 10) / 10,
      ];
    }
  }
  try {
    window.localStorage.setItem(CLE, JSON.stringify({
      layout: etat.layout, vue: etat.vue, rotation: etat.rotation,
      noms: etat.noms, ressorts: etat.ressorts, taille: etat.taille,
      zoom: etat.zoom, camx: etat.camx, camy: etat.camy,
      angle: etat.angle,
      replies: etat.replies, positions: positions,
    }));
    toast('Réglages et positions figés');
  } catch (e) { toast('Stockage local indisponible'); }
}

/* ================================================================ données */

var graphe = null, couches = null;
var noeuds = [], ordre = [], parId = {}, groupes = [], parGroupe = {};
var liens = [], voisins = {}, memoire = [];
var COULEUR_SOURCE = {}, LIBELLE_SOURCE = {};
var indexWiki = {};                                 // slug de fiche → [nœuds] (wikiliens)

var GLYPHES_APP = {
  // Optionnel : associe un glyphe à un nom de serveur MCP connu, pour le
  // reconnaître d'un coup d'œil dans la vue « système ». Exemple :
  //   github: 'G', slack: 'S'
  // Les serveurs non listés reçoivent un glyphe par défaut.
};

function libelleApp(nom) {
  return String(nom || '').replace(/^claude_ai_/, '').replace(/[_-]/g, ' ');
}

function glypheApp(nom) {
  if (GLYPHES_APP[nom]) return GLYPHES_APP[nom];
  if (/^claude_ai_/.test(nom)) {
    if (/gmail/i.test(nom)) return 'M';
    if (/drive/i.test(nom)) return 'triangle';
    if (/calendar|calendrier/i.test(nom)) return 'calendrier';
    if (/supermetrics/i.test(nom)) return 'S';
    return 'etoile';
  }
  return (libelleApp(nom).charAt(0) || '?').toUpperCase();
}

function construire(g, c) {
  graphe = g;
  couches = c || { applications: [], routines: [], skills: [] };
  (graphe.sources || []).forEach(function (s) {
    COULEUR_SOURCE[s.id] = s.color || '#8899aa';
    LIBELLE_SOURCE[s.id] = s.label || s.id;
  });
  reconstruireModele();
}

function ajouter(n) { noeuds.push(n); parId[n.id] = n; }

function reconstruireModele() {
  noeuds = []; parId = {}; groupes = []; parGroupe = {}; liens = []; voisins = {}; memoire = [];
  indexWiki = {};
  /* le modèle est recréé (nœuds neufs) : toute plongée/lecture en cours devient
     caduque. On remonte à la vue d'ensemble proprement. */
  etat.pile = []; etat.galaxie = null; etat.marqueurs = [];
  etat.drillAnim = false; etat.drillMix = 1; etat.avantPlongee = null;
  if (typeof fermerLiseuse === 'function') fermerLiseuse();
  if (typeof majFilDariane === 'function') majFilDariane();
  if (typeof majBoutonsGalaxie === 'function') majBoutonsGalaxie();

  var racine = (graphe.sources && graphe.sources[0]) ? graphe.sources[0].root : '';
  ajouter({
    id: '#centre', kind: 'centre', label: 'CLAUDE.md', couleur: '#ff9d4d', z: 0,
    r: 15, data: { chemin: racine ? racine + '/CLAUDE.md' : 'CLAUDE.md' }, p: {},
  });

  /* ------------------------------------------------------------- galaxies */
  var index = {};
  (graphe.nodes || []).forEach(function (n) {
    var cle, lib;
    if (etat.vue === 'dossiers') {
      var reste = n.id.indexOf('/') >= 0 ? n.id.slice(n.id.indexOf('/') + 1) : n.id;
      var seg = reste.indexOf('/') >= 0 ? reste.slice(0, reste.indexOf('/')) : '(racine)';
      cle = n.source + '/' + seg;
      lib = seg === '(racine)' ? (LIBELLE_SOURCE[n.source] || n.source) : seg;
    } else {
      cle = n.source;
      lib = LIBELLE_SOURCE[n.source] || n.source;
    }
    if (!index[cle]) {
      index[cle] = {
        cle: cle, label: String(lib).toUpperCase(), source: n.source,
        couleur: COULEUR_SOURCE[n.source] || '#8899aa', fiches: [],
      };
      groupes.push(index[cle]);
    }
    index[cle].fiches.push(n);
  });

  groupes.sort(function (a, b) { return b.fiches.length - a.fiches.length || (a.cle < b.cle ? -1 : 1); });

  var poidsTotal = 0;
  /* Poids en racine carrée : sinon un dossier de 34 fiches écrase huit dossiers
     de deux, qui se retrouvent collés avec des étiquettes illisibles. */
  groupes.forEach(function (g) {
    g.poids = Math.max(Math.sqrt(g.fiches.length), 1.7);
    poidsTotal += g.poids;
  });

  /* Les amas fixes (Routines ≈1.16, Skills ≈2.44, Applications ≈3.32 rad) occupent
     le secteur gauche/bas. On le réserve : les galaxies mémoire se répartissent sur
     l'arc LIBRE seulement, sinon une galaxie (Pangos) se colle à la ruche Applications
     en disposition Force. arcLibre est réparti au prorata du poids de chaque galaxie. */
  var RESERVE0 = 0.74, RESERVE1 = 3.80;
  var arcLibre = TAU - (RESERVE1 - RESERVE0);
  var angle = RESERVE1;
  groupes.forEach(function (g, i) {
    var span = arcLibre * g.poids / poidsTotal;
    g.a0 = angle; g.a1 = angle + span; g.centreAngle = angle + span / 2;
    angle += span;
    parGroupe[g.cle] = g;
    g.impair = (i % 2) === 1;

    g.hub = {
      id: '#hub:' + g.cle, kind: 'hub', label: g.label, couleur: g.couleur,
      r: 9, groupe: g.cle, data: { nb: g.fiches.length, source: g.source },
      p: {}, graine: i * 7919 + 13,
    };
    ajouter(g.hub);
    memoire.push(g.hub);

    g.fiches.sort(function (a, b) {
      return (b.inbound - a.inbound) || (b.size - a.size) || (a.id < b.id ? -1 : 1);
    });

    var rn = alea(i * 104729 + 7);
    g.fiches.forEach(function (f, j) {
      var brut = f.zone === 'raw';
      ajouter({
        id: f.id, kind: 'fiche', label: f.label || nomFichier(f.id), fichier: nomFichier(f.id),
        couleur: g.couleur, groupe: g.cle, brut: brut, zone: f.zone,
        draft: (f.statut === 'draft'),
        r: (brut ? 2.2 : 3.0) + Math.sqrt(Math.max(f.inbound, 0)) * 2.2 + Math.min(f.size / 8000, 2.1),
        data: f, p: {}, rang: j, graine: (i * 131 + j) * 7919 % 2147483647,
      });
      memoire.push(parId[f.id]);
    });
  });

  (graphe.links || []).forEach(function (l) {
    var a = parId[l.source], b = parId[l.target];
    if (!a || !b) return;
    liens.push({ a: a, b: b, broken: !!l.broken });
    (voisins[a.id] || (voisins[a.id] = [])).push(b.id);
    (voisins[b.id] || (voisins[b.id] = [])).push(a.id);
  });

  (couches.skills || []).forEach(function (s, i) {
    ajouter({
      id: '#skill:' + s.name, kind: 'skill', label: s.name, couleur: '#ff9d4d',
      z: ((i % 3) - 1) * 0.3, r: 4.4, data: s, p: {}, graine: i * 977 + 3,
    });
  });

  (couches.routines || []).forEach(function (r, i) {
    ajouter({
      id: '#routine:' + r.name, kind: 'routine', label: r.name, couleur: '#e8c268',
      z: ((i % 3) - 1) * 0.22, r: 8.5, data: r, p: {}, graine: i * 613 + 5,
    });
  });

  (couches.applications || []).forEach(function (a, i) {
    ajouter({
      id: '#app:' + a.name, kind: 'app', label: libelleApp(a.name), couleur: '#7ea8d8',
      z: ((i % 3) - 1) * 0.18, r: 34, data: a, glyphe: glypheApp(a.name), p: {}, graine: i * 389 + 11,
    });
  });

  /* ordre de peinture STABLE (carte plate, plus de tri par profondeur) :
     les fiches au fond, puis hubs et amas, le noyau par-dessus tout. */
  var PRIO = { fiche: 0, skill: 1, routine: 2, hub: 3, app: 4, centre: 5 };
  ordre = noeuds.slice().sort(function (a, b) {
    return (PRIO[a.kind] || 0) - (PRIO[b.kind] || 0);
  });

  /* index des wikiliens : slug (nom de fichier sans extension) → fiche(s). Sert à
     rendre cliquables les [[...]] du contenu, en préférant la même source. */
  noeuds.forEach(function (n) {
    if (n.kind !== 'fiche') return;
    var b = nomFichier(n.id).replace(/\.[^.]+$/, '').toLowerCase();
    (indexWiki[b] || (indexWiki[b] = [])).push(n);
  });

  calculerDispositions();
  majCompte();
}

function majCompte() {
  var nf = (graphe.nodes || []).length;
  $('compte').textContent =
    nf + ' fiches · ' + groupes.length + ' galaxies · ' +
    (couches.skills || []).length + ' skills · ' +
    (couches.routines || []).length + ' routines · ' +
    (couches.applications || []).length + ' applications';
  $('q').placeholder = 'Rechercher ' + nf + ' fichiers…  ( / )';
}

/* ============================================ dispositions (quatre layouts) */

/* Ancrages des amas non mémoire en mode Force. Recalculés à chaque changement
   de vue : leur distance suit la taille réelle des galaxies, sinon un petit
   corpus donne une scène vide et un gros corpus une bouillie. */
var ANCRE_SKILL = { x: -520, y: 420 };
var ANCRE_ROUTINE = { x: 150, y: 660 };
var ANCRE_APP = { x: -830, y: -20 };

var ESP = 13;                                   // écartement typique entre fiches
var ECHELLE_SKILL = 90, ECHELLE_ROUTINE = 60;
function rayonAmas(n) { return 10 + 0.62 * Math.sqrt(Math.max(n, 1)) * ESP; }

function spiraleHex(j) {
  if (j === 0) return { q: 0, r: 0 };
  var k = Math.floor((3 + Math.sqrt(9 + 12 * (j - 1))) / 6);
  while (3 * k * (k + 1) + 1 <= j) k++;
  while (k > 1 && 3 * (k - 1) * k + 1 > j) k--;
  var debut = 3 * k * (k - 1) + 1;
  var pos = j - debut;
  var cote = Math.floor(pos / k), pas = pos % k;
  var DIR = [[1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1], [1, 0]];
  var d0 = DIR[(cote + 4) % 6], d1 = DIR[cote % 6];
  return { q: d0[0] * k + d1[0] * pas, r: d0[1] * k + d1[1] * pas };
}

function calculerDispositions() {
  var i, n;

  /* ------- échelle de la scène en mode Force, déduite du corpus réel ------- */
  var rMax = 0;
  groupes.forEach(function (g) {
    var somme = 0;
    for (var j = 0; j < g.fiches.length; j++) somme += parId[g.fiches[j].id].r;
    var esp = 2 * (somme / Math.max(g.fiches.length, 1) * 1.35 + 2.2);
    g.rayon = 12 + 0.62 * Math.sqrt(g.fiches.length) * esp;
    if (g.rayon > rMax) rMax = g.rayon;
  });
  /* Rayon de l'anneau des galaxies : assez large pour qu'à écart angulaire égal
     l'écart PHYSIQUE entre deux galaxies dépasse la somme de leurs rayons — sinon
     Vente et Game-dev (les deux plus grosses) se touchent. La toile est vaste,
     on peut pousser au large sans gêner. */
  var sommeRayons = 0;
  groupes.forEach(function (g) { sommeRayons += g.rayon; });
  var Rg = Math.max(rMax * 1.15 + 160, sommeRayons * 0.9 + 120);
  /* Les galaxies ne sont plus toutes sur un même cercle : leur distance au
     noyau varie (les plus grosses au large). Une fois la scène enroulée sur
     la coquille, cette variation devient une variation de LATITUDE — c'est
     ce qui répartit vraiment les galaxies sur la sphère plutôt qu'en collier. */
  var nbG = Math.max(groupes.length - 1, 1);
  groupes.forEach(function (g, i) {
    g.Rg = Rg * (1.10 - 0.26 * (i / nbG));
    g.fx = Math.cos(g.centreAngle) * g.Rg;
    g.fy = Math.sin(g.centreAngle) * g.Rg;
  });
  var nbSk = 0, nbRo = 0;
  for (i = 0; i < noeuds.length; i++) {
    if (noeuds[i].kind === 'skill') nbSk++;
    else if (noeuds[i].kind === 'routine') nbRo++;
  }
  var rSk = rayonAmas(nbSk), rRo = rayonAmas(nbRo);
  ANCRE_SKILL.x = Math.cos(2.44) * (Rg + rSk + 175);
  ANCRE_SKILL.y = Math.sin(2.44) * (Rg + rSk + 175);
  ANCRE_ROUTINE.x = Math.cos(1.16) * (Rg + rRo + 195);
  ANCRE_ROUTINE.y = Math.sin(1.16) * (Rg + rRo + 195);
  ANCRE_APP.x = Math.cos(3.32) * (Rg + 275);
  ANCRE_APP.y = Math.sin(3.32) * (Rg + 275);
  ECHELLE_SKILL = rSk; ECHELLE_ROUTINE = rRo;

  var c = parId['#centre'];
  c.p.force = { x: 0, y: 0 }; c.p.circle = { x: 0, y: 0 };
  c.p.hex = { x: 0, y: 0 }; c.p.rings = { x: 0, y: 0, plat: 1 };

  /* -------- skills : trois anneaux fins en rotation */
  var sk = [];
  for (i = 0; i < noeuds.length; i++) if (noeuds[i].kind === 'skill') sk.push(noeuds[i]);
  var total = sk.length, cap = [1, 1, 1];
  if (total) {
    var somme = R_SKILL[0] + R_SKILL[1] + R_SKILL[2];
    cap[0] = Math.max(1, Math.round(total * R_SKILL[0] / somme));
    cap[1] = Math.max(1, Math.round(total * R_SKILL[1] / somme));
    cap[2] = Math.max(1, total - cap[0] - cap[1]);
  }
  var k = 0;
  for (var an = 0; an < 3; an++) {
    for (i = 0; i < cap[an] && k < total; i++, k++) {
      n = sk[k];
      var ra0 = R_SKILL[an], aa0 = (i / cap[an]) * TAU + an * 0.31, sp0 = an % 2 ? -0.62 : 0.9;
      n.p.circle = { r: ra0, a: aa0, spin: sp0 };
      n.p.hex = { r: ra0, a: aa0, spin: sp0 };
      /* en Anneaux les orbites restent PLATES : c'est le tangage global qui
         les incline et leur donne l'ellipse d'un système planétaire. */
      n.p.rings = { r: ra0, a: aa0, spin: sp0, plat: 1 };
      var rn = alea(n.graine);
      var ra = rn() * TAU, rr = ECHELLE_SKILL * (0.16 + Math.sqrt(rn()) * 0.98);
      n.p.force = { x: ANCRE_SKILL.x + Math.cos(ra) * rr, y: ANCRE_SKILL.y + Math.sin(ra) * rr * 0.8 };
    }
  }

  /* -------- galaxies mémoire ------------------------------------------------
     Les rayons des couches ne sont PAS figés : ils suivent l'encombrement réel
     des galaxies. Un corpus de 120 fiches ne doit pas flotter au milieu d'un
     anneau prévu pour 35 000. */
  var espace = 15, pasH = espace * 0.78, rEnc = 0;
  groupes.forEach(function (g) {
    var nb = g.fiches.length, idx = 0, a = 1, Rc = 0;
    while (idx < nb) {
      Rc = a * espace * 1.4;
      idx += Math.max(3, Math.floor(TAU * Rc / espace));
      a++;
    }
    var k = Math.ceil((Math.sqrt(Math.max(12 * nb - 3, 1)) - 3) / 6);
    g.rCercle = Math.max(Rc, k * pasH * 1.9, 24);
    if (g.rCercle > rEnc) rEnc = g.rCercle;
  });
  var Rcircle = R_MEM0 + rEnc * 1.02;
  var rMemMax = Rcircle + rEnc;

  groupes.forEach(function (g) {
    var ang = g.centreAngle, Rg = Rcircle;
    g.cx = Math.cos(ang) * Rg; g.cy = Math.sin(ang) * Rg;
    var nb = g.fiches.length;

    g.hub.p.circle = { x: g.cx, y: g.cy };
    g.hub.p.hex = { x: g.cx, y: g.cy };
    g.hub.p.rings = { r: R_MEM0 - 16, a: ang, spin: -0.3, plat: 1 };

    /* Cercle */
    var idx = 0, aC = 1;
    while (idx < nb) {
      var Rc = aC * espace * 1.4;
      var capa = Math.max(3, Math.floor(TAU * Rc / espace));
      for (var q = 0; q < capa && idx < nb; q++, idx++) {
        var nf = parId[g.fiches[idx].id];
        var aa = ang + (q / capa) * TAU;
        nf.p.circle = { x: g.cx + Math.cos(aa) * Rc, y: g.cy + Math.sin(aa) * Rc };
      }
      aC++;
    }

    /* Hex */
    g.fiches.forEach(function (f, j) {
      var h = spiraleHex(j), nn = parId[f.id];
      nn.p.hex = {
        x: g.cx + pasH * 1.5 * h.q,
        y: g.cy + pasH * Math.sqrt(3) * (h.r + h.q / 2),
      };
    });

    /* --- Anneaux : bande d'arcs concentriques, une par galaxie ---
       Le nombre de rangées est choisi pour que la bande couvre une bonne part
       de la zone mémoire : avec peu de fiches, une seule rangée large donnerait
       un cercle vide au lieu des arcs serrés des références. */
    var pasA = 16, pasR = 18;                        // écarts arc / radial
    var cible = Math.max(3, Math.min(18, Math.round(Math.sqrt(nb) * 0.95)));
    var somme = 0;
    for (var q2 = 0; q2 < cible; q2++) somme += R_MEM0 + q2 * pasR;
    /* demi-ouverture de la bande : calée pour obtenir ~cible rangées pleines */
    var demi = Math.max(0.11, Math.min(nb * pasA / (2 * somme), (g.a1 - g.a0) * 0.47));
    var aC2 = g.centreAngle;
    var pris = 0, rg = 0;
    while (pris < nb && rg < 260) {
      var Rr = R_MEM0 + rg * pasR;
      var np = Math.max(2, Math.round(2 * demi * Rr / pasA));
      for (var t = 0; t < np && pris < nb; t++, pris++) {
        var frac = np === 1 ? 0.5 : t / (np - 1);
        var nf2 = parId[g.fiches[pris].id];
        nf2.p.rings = { r: Rr, a: aC2 - demi + frac * demi * 2, spin: -0.34, plat: 1 };
        nf2.gradTaille = 1.2 - 0.4 * Math.min(rg / 9, 1);
      }
      rg++;
    }
    if (R_MEM0 + rg * pasR > rMemMax) rMemMax = R_MEM0 + rg * pasR;
  });

  /* ---- rayons des couches externes, proportionnés à la zone mémoire ---- */
  RA.mem1 = Math.max(rMemMax + 16, R_SKILL[2] + 90);
  RA.routines = RA.mem1 * 1.24;
  RA.apps = RA.mem1 * 1.54;

  /* -------- routines : planètes régulièrement espacées sur l'anneau doré */
  var ro = [];
  for (i = 0; i < noeuds.length; i++) if (noeuds[i].kind === 'routine') ro.push(noeuds[i]);
  ro.forEach(function (x, j) {
    var ar = -Math.PI / 2 + (j / Math.max(ro.length, 1)) * TAU;
    x.p.circle = { r: RA.routines, a: ar, spin: 0.42 };
    x.p.hex = { r: RA.routines, a: ar, spin: 0.42 };
    x.p.rings = { r: RA.routines, a: ar, spin: 0.42, plat: 1 };
    var rn = alea(x.graine);
    var ra = rn() * TAU, rr = ECHELLE_ROUTINE * (0.2 + Math.sqrt(rn()) * 0.9);
    x.p.force = { x: ANCRE_ROUTINE.x + Math.cos(ra) * rr, y: ANCRE_ROUTINE.y + Math.sin(ra) * rr * 0.8 };
  });

  /* -------- applications : hexagones sur l'anneau d'acier */
  var ap = [];
  for (i = 0; i < noeuds.length; i++) if (noeuds[i].kind === 'app') ap.push(noeuds[i]);
  ap.forEach(function (x, j) {
    var aa = -Math.PI / 2 + (j / Math.max(ap.length, 1)) * TAU;
    x.p.circle = { r: RA.apps, a: aa, spin: -0.19 };
    x.p.hex = { r: RA.apps, a: aa, spin: -0.19 };
    x.p.rings = { r: RA.apps, a: aa, spin: -0.19, plat: 1 };
    /* nid d'abeille compact : hexagones pointe en haut, côtés jointifs */
    var h = spiraleHex(j), pas = 44;
    x.p.force = {
      x: ANCRE_APP.x + pas * Math.sqrt(3) * (h.q + h.r / 2),
      y: ANCRE_APP.y + pas * 1.5 * h.r,
    };
  });

  /* ---- rayon de scène : sert d'unité au cadrage et au voile central.
         Il englobe les anneaux ET les amas du mode Force. */
  var hyp = function (a, b) { return Math.sqrt(a * a + b * b); };
  etat.sceneR = Math.max(
    RA.apps,
    hyp(ANCRE_SKILL.x, ANCRE_SKILL.y) + ECHELLE_SKILL,
    hyp(ANCRE_ROUTINE.x, ANCRE_ROUTINE.y) + ECHELLE_ROUTINE,
    hyp(ANCRE_APP.x, ANCRE_APP.y) + 220,
    Rg * 1.10 + rMax,
    260
  );

  /* respiration des galaxies (±2 %), déphasée par l'angle d'or */
  groupes.forEach(function (g, i) {
    g.respPhase = (i * 2.399963) % TAU;
    g.resp = 1;
  });

  initialiserForce();
  simuler(320, 1);
}

/* --------------------------------------------------------- mini-simulation */

function initialiserForce() {
  var sauve = (reglages && reglages.positions) || null;
  memoire.forEach(function (n) {
    var g = parGroupe[n.groupe];
    if (sauve && sauve[n.id]) {
      /* positions figées : (x, y). On tolère un ancien 3e nombre (z) — ignoré. */
      var s = sauve[n.id];
      n.p.force = { x: s[0], y: s[1], fige: 1 };
    }
    else if (n.kind === 'hub') n.p.force = { x: g.fx, y: g.fy };
    else {
      var rn = alea(n.graine);
      var a = rn() * TAU, r = 6 + Math.sqrt(rn()) * g.rayon;
      n.p.force = { x: g.fx + Math.cos(a) * r, y: g.fy + Math.sin(a) * r };
    }
    n.vx = 0; n.vy = 0;
  });
}

/**
 * Répulsion + résolution de collisions par grille uniforme : O(n), écrit pour
 * tenir à 3 000 nœuds. La collision (distance minimale = somme des rayons) est
 * ce qui donne l'AMAS DENSE des captures ; une répulsion seule laisse des trous.
 */
function repulsion(alpha) {
  var cell = 34, i, n;
  var map = Object.create(null);
  for (i = 0; i < memoire.length; i++) {
    n = memoire[i];
    var p = n.p.force;
    n._cx = Math.floor(p.x / cell); n._cy = Math.floor(p.y / cell);
    var cle = n._cx + ':' + n._cy;
    (map[cle] || (map[cle] = [])).push(n);
  }
  for (i = 0; i < memoire.length; i++) {
    n = memoire[i];
    var pn = n.p.force;
    var rn = n.kind === 'hub' ? n.r * 1.9 : n.r * 1.35 + 2.2;
    for (var dx = -1; dx <= 1; dx++) for (var dy = -1; dy <= 1; dy++) {
      var vg = map[(n._cx + dx) + ':' + (n._cy + dy)];
      if (!vg) continue;
      for (var j = 0; j < vg.length; j++) {
        var m = vg[j];
        if (m === n) continue;
        var pm = m.p.force;
        var ex = pn.x - pm.x, ey = pn.y - pm.y;
        var d2 = ex * ex + ey * ey;
        if (d2 === 0) { ex = 0.4; ey = -0.3; d2 = 0.25; }
        var d = Math.sqrt(d2);
        var dmin = rn + (m.kind === 'hub' ? m.r * 1.9 : m.r * 1.35 + 2.2);
        if (d < dmin) {
          /* correction de position immédiate (dynamique par positions) */
          var corr = (dmin - d) * 0.5 * Math.min(alpha * 2.4, 1);
          pn.x += (ex / d) * corr; pn.y += (ey / d) * corr;
          pm.x -= (ex / d) * corr; pm.y -= (ey / d) * corr;
        } else if (n.kind === 'hub' || m.kind === 'hub') {
          var f = Math.min(900 / d2, 4);
          n.vx += (ex / d) * f * alpha; n.vy += (ey / d) * f * alpha;
        }
      }
    }
  }
}

function pas(alpha) {
  var i, n, g, p;
  for (i = 0; i < memoire.length; i++) {
    n = memoire[i];
    if (n.kind !== 'fiche') continue;
    g = parGroupe[n.groupe]; p = n.p.force;
    var ph = g.hub.p.force;
    var dx = ph.x - p.x, dy = ph.y - p.y;
    var d = Math.sqrt(dx * dx + dy * dy) || 0.001;
    /* Attraction LINÉAIRE vers le hub (pas de longueur au repos) : combinée à
       la répulsion, elle donne un amas PLEIN — une longueur au repos donnerait
       un anneau creux, ce que les captures ne montrent pas. */
    var f = d * 0.013;
    n.vx += (dx / d) * f * alpha; n.vy += (dy / d) * f * alpha;
  }

  var kl = 0.035 * etat.ressorts;
  for (i = 0; i < liens.length; i++) {
    var a = liens[i].a, b = liens[i].b;
    if (!a.p.force || !b.p.force) continue;
    var pa = a.p.force, pb = b.p.force;
    var lx = pb.x - pa.x, ly = pb.y - pa.y;
    var ld = Math.sqrt(lx * lx + ly * ly) || 0.001;
    var lf = (ld - 58) * kl;
    a.vx += (lx / ld) * lf * alpha; a.vy += (ly / ld) * lf * alpha;
    b.vx -= (lx / ld) * lf * alpha; b.vy -= (ly / ld) * lf * alpha;
  }

  repulsion(alpha);

  for (i = 0; i < memoire.length; i++) {
    n = memoire[i];
    if (n.kind !== 'hub') continue;
    g = parGroupe[n.groupe]; p = n.p.force;
    n.vx += (g.fx - p.x) * 0.03 * alpha;
    n.vy += (g.fy - p.y) * 0.03 * alpha;
  }

  for (i = 0; i < memoire.length; i++) {
    n = memoire[i]; p = n.p.force;
    n.vx *= 0.80; n.vy *= 0.80;
    var v = Math.sqrt(n.vx * n.vx + n.vy * n.vy);
    if (v > 12) { n.vx *= 12 / v; n.vy *= 12 / v; }
    p.x += n.vx; p.y += n.vy;
  }
}

function simuler(iterations, alpha0) {
  var alpha = alpha0;
  for (var it = 0; it < iterations; it++) { pas(alpha); alpha *= 0.985; }
}

/* ==================================================== résolution de position */

var _pa3 = { x: 0, y: 0, z: 0 }, _pb3 = { x: 0, y: 0, z: 0 };
var _w3 = { x: 0, y: 0, z: 0 }, _pr = { x: 0, y: 0, z: 0, k: 1 };
var _e3 = { x: 0, y: 0, z: 0, k: 1, d: 0 };

function resoudre(n, lay, phase, out) {
  var e = n.p[lay];
  if (!e) { out.x = 0; out.y = 0; out.z = 0; return out; }
  var x, y;
  if (e.r !== undefined) {
    /* orbites CIRCULAIRES vues de face : `phase·spin` fait tourner lentement
       chaque anneau (rotation différentielle), toujours dans le plan. */
    var a = e.a + phase * e.spin;
    x = e.r * Math.cos(a); y = e.r * Math.sin(a);
  } else { x = e.x; y = e.y; }
  out.x = x; out.y = y; out.z = 0;
  return out;
}

/** Avancement de la transition POUR CE NŒUD : retard proportionnel à sa
    distance au centre → la nouvelle disposition part en vague du noyau. */
function avanceeTrans(n, now) {
  if (now >= etat.transFin) return 1;
  return ressort((now - etat.transT0 - (n.retard || 0)) / DUREE_TRANS);
}

function positionner(n, phase, now, out) {
  if (etat.layout === etat.layoutPrec) return resoudre(n, etat.layout, phase, out);
  var m = avanceeTrans(n, now);
  if (m >= 1) return resoudre(n, etat.layout, phase, out);
  if (m <= 0) return resoudre(n, etat.layoutPrec, phase, out);
  resoudre(n, etat.layoutPrec, phase, _pa3);
  resoudre(n, etat.layout, phase, _pb3);
  var dx = _pb3.x - _pa3.x, dy = _pb3.y - _pa3.y;
  out.x = _pa3.x + dx * m;
  out.y = _pa3.y + dy * m;
  /* Arc « spiralé » : chaque nœud rejoint sa place par une COURBE, pas une ligne
     droite — la galaxie semble se reformer en tourbillon plutôt que de glisser. La
     flèche perpendiculaire (normale +90° au trajet, sens de rotation cohérent pour
     tous → l'ensemble pivote) culmine à mi-parcours (sin) et s'annule EXACTEMENT aux
     deux bouts : les positions de départ et d'arrivée restent au pixel près. */
  var raw = borner((now - etat.transT0 - (n.retard || 0)) / DUREE_TRANS, 0, 1);
  var bump = Math.sin(raw * Math.PI);
  if (bump > 0.0001) {
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 1e-3) {
      var amp = Math.min(dist * 0.17, 130) * bump;   // ∝ longueur du trajet, plafonné
      out.x += (-dy / dist) * amp;
      out.y += (dx / dist) * amp;
    }
  }
  out.z = 0;
  return out;
}

/* ============================================================ caméra & plan */

var cv = $('ciel'), ctx = cv.getContext('2d');
var L = 0, H = 0, DPR = 1;

/* cosinus/sinus de l'angle du plan, rafraîchis une fois par frame */
var CA = 1, SA = 0;

function majOrientation() {
  CA = Math.cos(etat.angle); SA = Math.sin(etat.angle);
}

/**
 * PROJECTION PLATE. Plus de perspective ni de profondeur : le monde est un
 * plan qu'on fait simplement PIVOTER autour de son centre, dans le plan de
 * l'écran. `k` reste à 1 (aucune décroissance avec la distance), `z` à 0.
 */
function projeter(x, y, z, out) {
  out.x = x * CA - y * SA;
  out.y = x * SA + y * CA;
  out.z = 0; out.k = 1;
  return out;
}

/** Coordonnées projetées → écran (pan/zoom du plan). */
function versEcran(wx, wy, par) {
  var p = par === undefined ? 1 : par;
  return {
    x: (wx - etat.camx) * etat.zoom * p + L / 2,
    y: (wy - etat.camy) * etat.zoom * p + H / 2,
  };
}

function versMonde(sx, sy) {
  return { x: (sx - L / 2) / etat.zoom + etat.camx, y: (sy - H / 2) / etat.zoom + etat.camy };
}

/** Point du plan de composition → écran (pivot + pan/zoom). */
function ecranPlan(x, y, z, tx, out) {
  projeter(x, y, 0, _pr);
  out.x = (_pr.x - etat.camx) * etat.zoom + L / 2;
  out.y = (_pr.y - etat.camy) * etat.zoom + H / 2;
  out.z = 0; out.k = 1;
  return out;
}

function majCamera(dt) {
  if (etat.vol) {
    var v = etat.vol;
    var t = Math.min((performance.now() - v.t0) / v.duree, 1);
    var e = ease(t);
    etat.camx = v.x0 + (v.x1 - v.x0) * e;
    etat.camy = v.y0 + (v.y1 - v.y0) * e;
    etat.zoom = Math.exp(Math.log(v.z0) + (Math.log(v.z1) - Math.log(v.z0)) * e);
    etat.camxC = etat.camx; etat.camyC = etat.camy; etat.zoomC = etat.zoom;
    if (t >= 1) etat.vol = null;
    return true;
  }
  var k = 1 - Math.pow(0.0016, dt);       // amortissement doux, indépendant du dt
  var dz = etat.zoomC / etat.zoom;
  var bouge = Math.abs(Math.log(dz)) > 0.0006 ||
    Math.abs(etat.camxC - etat.camx) * etat.zoom > 0.25 ||
    Math.abs(etat.camyC - etat.camy) * etat.zoom > 0.25;
  if (!bouge) { etat.zoom = etat.zoomC; etat.camx = etat.camxC; etat.camy = etat.camyC; return false; }
  etat.zoom = Math.exp(Math.log(etat.zoom) + Math.log(dz) * k);
  etat.camx += (etat.camxC - etat.camx) * k;
  etat.camy += (etat.camyC - etat.camy) * k;
  return true;
}

function volerVers(x, y, zoom, duree) {
  etat.vol = {
    t0: performance.now(), duree: duree || DUREE_VOL,
    x0: etat.camx, y0: etat.camy, z0: etat.zoom,
    x1: x, y1: y, z1: Math.min(Math.max(zoom, ZOOM_MIN), ZOOM_MAX),
  };
  reveiller();
}

function volerVersNoeud(n) {
  if (!n) return;
  majOrientation();
  resoudre(n, etat.layout, etat.phase, _w3);
  projeter(_w3.x, _w3.y, _w3.z, _pr);
  var z;
  if (n.kind === 'hub') {
    var g = parGroupe[n.groupe];
    z = Math.max(1.1, Math.min(3.6, 260 / (24 + Math.sqrt(g.fiches.length) * 16)));
  } else if (n.kind === 'app') z = 3.2;
  else if (n.kind === 'centre') z = 2.2;
  else z = Math.max(2.5, Math.min(16, 70 / Math.max(n.r, 2)));
  volerVers(_pr.x, _pr.y, z);
}

/** Boîte englobante du layout courant, une fois PROJETÉ (marge comprise). */
function contenu() {
  var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, n;
  majOrientation();
  for (var i = 0; i < noeuds.length; i++) {
    n = noeuds[i];
    if (n.cache) continue;
    resoudre(n, etat.layout, etat.phase, _w3);
    projeter(_w3.x, _w3.y, _w3.z, _pr);
    var m = (n.r + (n.kind === 'app' ? 34 : 18)) * _pr.k;
    if (_pr.x - m < x0) x0 = _pr.x - m;
    if (_pr.y - m < y0) y0 = _pr.y - m;
    if (_pr.x + m > x1) x1 = _pr.x + m;
    if (_pr.y + m > y1) y1 = _pr.y + m;
  }
  if (x0 > x1) return { x: 0, y: 0, w: R_SCENE * 2, h: R_SCENE * 2 };
  return { x: (x0 + x1) / 2, y: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0 };
}

/** Largeur réellement libre : le panneau flottant de droite masque 296 px. */
function PANNEAU() { return L > 900 ? 296 : 0; }

/** Cadrage sur l'ensemble de la scène (bouton « Recentrer », démarrage). */
function cadrerSurContenu(anime) {
  var b = contenu();
  var libre = Math.max(L - PANNEAU(), 200);
  var z = Math.min(libre / b.w, H / b.h) * 0.94;
  z = Math.min(Math.max(z, ZOOM_MIN), ZOOM_MAX);
  etat.zoomBase = z;
  var cx = b.x + (PANNEAU() / 2) / z;      // recentre dans la zone visible
  if (anime) volerVers(cx, b.y, z, 700);
  else {
    etat.camx = etat.camxC = cx; etat.camy = etat.camyC = b.y;
    etat.zoom = etat.zoomC = z;
  }
}

function recentrer() { cadrerSurContenu(true); }

/** Recalcule seulement le zoom de référence (sans bouger la caméra). */
function majZoomBase() {
  if (!noeuds.length || !L || !H) return;
  var b = contenu();
  var libre = Math.max(L - PANNEAU(), 200);
  etat.zoomBase = Math.min(Math.max(Math.min(libre / b.w, H / b.h) * 0.94, ZOOM_MIN), ZOOM_MAX);
}

/* ================================================================== rendu */

var etoiles = [];

function dimensionner() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  L = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(L * DPR); cv.height = Math.round(H * DPR);
  majZoomBase();
  reveiller();
}

/* Trois nappes d'étoiles à parallaxes distinctes : le fond lointain bouge à
   peine, la nappe proche file. Chacune scintille sur sa propre sinusoïde,
   déphasée par étoile — le ciel n'est jamais tout à fait le même. */
var NAPPES = [
  { par: 0.24, nb: 260, taille: [0.5, 0.9], eclat: [0.030, 0.10], vit: 0.5 },
  { par: 0.52, nb: 220, taille: [0.7, 1.3], eclat: [0.055, 0.17], vit: 0.9 },
  { par: 0.88, nb: 130, taille: [0.9, 1.9], eclat: [0.085, 0.26], vit: 1.5 },
];

function genererEtoiles() {
  var rn = alea(20260807);
  etoiles = [];
  for (var c = 0; c < NAPPES.length; c++) {
    var L0 = NAPPES[c];
    for (var i = 0; i < L0.nb; i++) {
      var a = rn() * TAU, r = 60 + Math.sqrt(rn()) * 1900;
      etoiles.push({
        x: Math.cos(a) * r, y: Math.sin(a) * r, par: L0.par,
        t: L0.taille[0] + rn() * (L0.taille[1] - L0.taille[0]),
        o: L0.eclat[0] + rn() * (L0.eclat[1] - L0.eclat[0]),
        ph: rn() * TAU, vt: L0.vit * (0.65 + rn() * 0.9),
      });
    }
  }
}

/* ------------------------------------------------- étoile filante discrète */

var filante = null, prochaineFilante = 0;

function majFilante(now, eveille) {
  if (!prochaineFilante) prochaineFilante = now + 9000 + Math.random() * 12000;
  if (!filante && eveille && now > prochaineFilante) {
    var bord = Math.random();
    filante = {
      t0: now, duree: 700 + Math.random() * 500,
      x0: (0.05 + bord * 0.7) * L, y0: -30 - Math.random() * 60,
      dx: (0.16 + Math.random() * 0.34) * L * (Math.random() < 0.5 ? -1 : 1),
      dy: (0.42 + Math.random() * 0.5) * H,
    };
    prochaineFilante = now + 20000 + Math.random() * 20000;
  }
  if (!filante) return;
  var u = (now - filante.t0) / filante.duree;
  if (u >= 1) { filante = null; return; }
  var x = filante.x0 + filante.dx * u, y = filante.y0 + filante.dy * u;
  var lg = 0.10, qx = x - filante.dx * lg, qy = y - filante.dy * lg;
  var a = Math.sin(u * Math.PI);
  var g = ctx.createLinearGradient(qx, qy, x, y);
  g.addColorStop(0, 'rgba(190,214,255,0)');
  g.addColorStop(1, 'rgba(226,238,255,' + (0.55 * a).toFixed(3) + ')');
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = g; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(qx, qy); ctx.lineTo(x, y); ctx.stroke();
  ctx.restore();
}

/* ----------------------------------------- impulsions d'énergie (filaments) */

var impulsions = [], prochaineImpulsion = 0;

function ajouterImpulsion(a, b, couleur, courbure, now) {
  if (impulsions.length > 46) return;
  impulsions.push({
    a: a, b: b, c: couleur, k: courbure,
    t0: now, duree: 780 + Math.random() * 620,
  });
}

/** Au survol : le nœud « appelle » aussitôt le long de ses propres liens. */
function impulserAutour(n, now) {
  if (!n) return;
  var g = parGroupe[n.groupe], nb = 0, i, l;
  if (g && n !== g.hub) ajouterImpulsion(g.hub, n, g.couleur, 0.13, now);
  if (g && n === g.hub) {
    ajouterImpulsion(parId['#centre'], n, '#ffb877', 0.14, now);
    for (i = 0; i < g.fiches.length && nb < 7; i++) {
      var f = parId[g.fiches[i].id];
      if (f && f.vis) { ajouterImpulsion(n, f, g.couleur, 0, now); nb++; }
    }
  }
  for (i = 0; i < liens.length && nb < 12; i++) {
    l = liens[i];
    if (l.a !== n && l.b !== n) continue;
    ajouterImpulsion(l.a, l.b, '#dbe6ff', 0.09, now); nb++;
  }
}

function semerImpulsions(now, eveille) {
  if (!eveille || now < prochaineImpulsion || !groupes.length) return;
  prochaineImpulsion = now + 620 + Math.random() * 1500;
  var c = parId['#centre'];
  var g = groupes[(Math.random() * groupes.length) | 0];
  if (!g) return;
  if (Math.random() < 0.42) ajouterImpulsion(c, g.hub, '#ffb877', 0.14, now);
  else if (g.fiches.length && !etat.replies[g.cle]) {
    var f = parId[g.fiches[(Math.random() * g.fiches.length) | 0].id];
    if (f) ajouterImpulsion(g.hub, f, g.couleur, 0, now);
  }
}

function dessinerImpulsions(now) {
  if (!impulsions.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (var i = impulsions.length - 1; i >= 0; i--) {
    var p = impulsions[i];
    var u = (now - p.t0) / p.duree;
    if (u >= 1) { impulsions.splice(i, 1); continue; }
    if (p.a.cache || p.b.cache) { impulsions.splice(i, 1); continue; }
    var ax = p.a.sx, ay = p.a.sy, bx = p.b.sx, by = p.b.sy;
    var mx = (ax + bx) / 2 - (by - ay) * p.k, my = (ay + by) / 2 + (bx - ax) * p.k;
    var v = 1 - u;
    var x = v * v * ax + 2 * v * u * mx + u * u * bx;
    var y = v * v * ay + 2 * v * u * my + u * u * by;
    if (x < -40 || x > L + 40 || y < -40 || y > H + 40) continue;
    var a = Math.sin(u * Math.PI);
    var R = 5 + 9 * a;
    ctx.globalAlpha = 0.55 * a;
    ctx.drawImage(halo(p.c), x - R, y - R, R * 2, R * 2);
    ctx.globalAlpha = 0.85 * a;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x, y, 1.05 + a * 0.8, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/* ---- sprites pré-rendus : halo net ---------------------------------------- */

var spritesHalo = {};

function halo(couleur) {
  if (spritesHalo[couleur]) return spritesHalo[couleur];
  var s = 128, c = document.createElement('canvas');
  c.width = c.height = s;
  var g = c.getContext('2d');
  var grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grad.addColorStop(0, hexRgba(couleur, 0.95));
  grad.addColorStop(0.12, hexRgba(couleur, 0.5));
  grad.addColorStop(0.32, hexRgba(couleur, 0.15));
  grad.addColorStop(0.62, hexRgba(couleur, 0.035));
  grad.addColorStop(1, hexRgba(couleur, 0));
  g.fillStyle = grad; g.fillRect(0, 0, s, s);
  spritesHalo[couleur] = c;
  return c;
}


/**
 * « Bille » pré-rendue : petite sphère éclairée en haut à gauche. C'est ce qui
 * donne aux points leur relief dans les captures. Un sprite par couleur, blitté
 * à la taille voulue — aucun dégradé n'est recréé pendant l'animation.
 */
var spritesBille = {};
function bille(couleur) {
  if (spritesBille[couleur]) return spritesBille[couleur];
  var s = 96, c = document.createElement('canvas');
  c.width = c.height = s;
  var g = c.getContext('2d');
  g.beginPath(); g.arc(s / 2, s / 2, s / 2 - 1, 0, TAU); g.clip();
  var grad = g.createRadialGradient(s * 0.36, s * 0.32, s * 0.03, s * 0.5, s * 0.5, s * 0.56);
  grad.addColorStop(0, eclaircir(couleur, 120));
  grad.addColorStop(0.34, eclaircir(couleur, 55));
  grad.addColorStop(0.78, couleur);
  grad.addColorStop(1, hexRgba(couleur, 0.72));
  g.fillStyle = grad; g.fillRect(0, 0, s, s);
  spritesBille[couleur] = c;
  return c;
}

/** Texte en petites capitales espacées, dessiné caractère par caractère. */
function texteEspace(txt, x, y, esp, aligne) {
  var s = String(txt), i, larg = 0;
  for (i = 0; i < s.length; i++) larg += ctx.measureText(s[i]).width + esp;
  larg -= esp;
  var cx = aligne === 'center' ? x - larg / 2 : x;
  for (i = 0; i < s.length; i++) { ctx.fillText(s[i], cx, y); cx += ctx.measureText(s[i]).width + esp; }
  return larg;
}

function cheminHexagone(x, y, r) {
  ctx.beginPath();
  for (var i = 0; i < 6; i++) {
    var a = -Math.PI / 2 + i * Math.PI / 3;
    var px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function arrondi(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function etoile4(x, y, R, r) {
  ctx.beginPath();
  ctx.moveTo(x, y - R);
  ctx.quadraticCurveTo(x + r * 0.35, y - r * 0.35, x + R, y);
  ctx.quadraticCurveTo(x + r * 0.35, y + r * 0.35, x, y + R);
  ctx.quadraticCurveTo(x - r * 0.35, y + r * 0.35, x - R, y);
  ctx.quadraticCurveTo(x - r * 0.35, y - r * 0.35, x, y - R);
  ctx.closePath();
}

/* ------------------------------------------------------------ pictogrammes */

function glypheNoyau(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = '#0a0d14'; ctx.lineWidth = Math.max(1, s * 0.13);
  ctx.fillStyle = '#0a0d14';
  ctx.beginPath(); ctx.moveTo(0, -s * 0.66); ctx.lineTo(0, -s * 0.92); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -s * 1.0, s * 0.1, 0, TAU); ctx.fill();
  var w = s * 0.86, h = s * 0.6;
  ctx.fillRect(-w / 2, -s * 0.66, w, h);
  ctx.fillStyle = '#ffb877';
  ctx.fillRect(-w * 0.28, -s * 0.5, w * 0.18, h * 0.3);
  ctx.fillRect(w * 0.1, -s * 0.5, w * 0.18, h * 0.3);
  ctx.fillStyle = '#0a0d14';
  ctx.fillRect(-s * 0.66, s * 0.04, s * 1.32, s * 0.52);
  ctx.strokeStyle = '#ffb877'; ctx.lineWidth = Math.max(1, s * 0.09);
  ctx.beginPath(); ctx.moveTo(0, s * 0.04); ctx.lineTo(0, s * 0.56); ctx.stroke();
  ctx.restore();
}

function glypheHub(x, y, s, source) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#0a0d14'; ctx.strokeStyle = '#0a0d14';
  ctx.lineWidth = Math.max(0.9, s * 0.17);
  if (source === 'kb') {
    for (var i = -1; i <= 1; i++) {
      ctx.beginPath();
      if (ctx.ellipse) ctx.ellipse(0, i * s * 0.34, s * 0.62, s * 0.2, 0, 0, TAU);
      else ctx.arc(0, i * s * 0.34, s * 0.3, 0, TAU);
      ctx.stroke();
    }
  } else if (source === 'vente') {
    ctx.beginPath();
    ctx.moveTo(-s * 0.62, 0); ctx.lineTo(0, -s * 0.62); ctx.lineTo(s * 0.62, 0);
    ctx.lineTo(0, s * 0.62); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -s * 0.16, s * 0.15, 0, TAU); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.rect(-s * 0.64, -s * 0.36, s * 1.28, s * 0.72); ctx.stroke();
    ctx.beginPath(); ctx.arc(-s * 0.26, 0, s * 0.12, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.26, 0, s * 0.12, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function glypheHorloge(x, y, s, couleur) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = couleur; ctx.lineWidth = Math.max(0.8, s * 0.17);
  ctx.beginPath(); ctx.moveTo(0, -s * 0.5); ctx.lineTo(0, 0); ctx.lineTo(s * 0.36, 0); ctx.stroke();
  ctx.restore();
}

function glypheConnecteur(nom, x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#f2f6ff'; ctx.strokeStyle = '#f2f6ff';
  ctx.lineWidth = Math.max(1, s * 0.14);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (nom === 'enveloppe') {
    ctx.beginPath(); ctx.rect(-s * 0.68, -s * 0.46, s * 1.36, s * 0.92); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-s * 0.68, -s * 0.46); ctx.lineTo(0, s * 0.06); ctx.lineTo(s * 0.68, -s * 0.46);
    ctx.stroke();
  } else if (nom === 'eclair') {
    ctx.beginPath();
    ctx.moveTo(s * 0.22, -s * 0.76); ctx.lineTo(-s * 0.44, s * 0.06);
    ctx.lineTo(s * 0.0, s * 0.06); ctx.lineTo(-s * 0.2, s * 0.78);
    ctx.lineTo(s * 0.48, -s * 0.1); ctx.lineTo(s * 0.02, -s * 0.1);
    ctx.closePath(); ctx.fill();
  } else if (nom === 'oeil') {
    ctx.beginPath();
    ctx.moveTo(-s * 0.76, 0);
    ctx.quadraticCurveTo(0, -s * 0.74, s * 0.76, 0);
    ctx.quadraticCurveTo(0, s * 0.74, -s * 0.76, 0);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, s * 0.23, 0, TAU); ctx.fill();
  } else if (nom === 'triangle') {
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.68); ctx.lineTo(s * 0.72, s * 0.58); ctx.lineTo(-s * 0.72, s * 0.58);
    ctx.closePath(); ctx.fill();
  } else if (nom === 'calendrier') {
    ctx.beginPath(); ctx.rect(-s * 0.7, -s * 0.6, s * 1.4, s * 1.2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s * 0.7, -s * 0.24); ctx.lineTo(s * 0.7, -s * 0.24); ctx.stroke();
    ctx.font = '700 ' + (s * 0.6).toFixed(1) + 'px -apple-system,Helvetica,Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('31', 0, s * 0.22);
  } else if (nom === 'etoile') {
    etoile4(0, 0, s * 0.8, s * 0.24); ctx.fill();
  } else {
    ctx.font = '700 ' + (s * 1.15).toFixed(1) + 'px -apple-system,Helvetica,Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(nom, 0, s * 0.04);
  }
  ctx.restore();
}

/* ------------------------------------------------------------------- boucle */

var t0 = performance.now(), raf = null, enPause = false, dernierTemps = 0;

function reveiller() {
  etat.derniereInteraction = performance.now();
  if (enPause) { enPause = false; dernierTemps = 0; boucler(); }
}

function boucler() {
  if (raf) return;
  raf = requestAnimationFrame(function (now) {
    raf = null;
    if (document.hidden) { enPause = true; return; }
    var camBouge = dessiner(now);
    var anime = (etat.rotation > 0.001 && !etat.pauseRot) || now < etat.transFin || etat.vol || camBouge
      || impulsions.length || filante || etat.drillAnim
      || now < etat.chaudJusqua || (now - etat.derniereInteraction) < 4000;
    if (anime) boucler(); else enPause = true;
  });
}

/* ------------------------------------------------------------------ frame */

function dessiner(now) {
  var dt = dernierTemps ? Math.min((now - dernierTemps) / 1000, 0.1) : 0.016;
  dernierTemps = now;
  var temps = (now - t0) / 1000;

  var camBouge = majCamera(dt);

  /* ---------------------------------------------------- rotation du plan 2D */
  /* Rotation AUTOMATIQUE lente du disque, sauf pendant qu'on le tourne à la
     main (clic droit / Maj+glisser) : l'auto se met alors en pause. */
  if (!(tire && orbite) && !etat.pauseRot) {
    etat.angle += dt * etat.rotation * 0.115;
    etat.phase += dt * etat.rotation * 0.16;        // rotation différentielle des anneaux
  }

  /* avancement de l'animation de plongée (drill-down) */
  if (etat.drillAnim) {
    var dm = Math.min((now - etat.drillT0) / 640, 1);
    etat.drillMix = ease(dm);
    if (dm >= 1) { etat.drillAnim = false; etat.drillMix = 1; }
  }
  if (etat.angle > TAU) etat.angle -= TAU;
  else if (etat.angle < -TAU) etat.angle += TAU;
  majOrientation();

  var enTransition = now < etat.transFin && etat.layout !== etat.layoutPrec;
  if (!enTransition && etat.layoutPrec !== etat.layout) etat.layoutPrec = etat.layout;
  if (etat.layout === 'force' && now < etat.chaudJusqua) pas(0.09);

  var melangeG = etat.layout === etat.layoutPrec ? 1
    : ressort((now - etat.transT0 - ETALEMENT * 0.5) / DUREE_TRANS);
  var partForce = (etat.layout === 'force' ? melangeG : 0)
    + (etat.layoutPrec === 'force' ? 1 - melangeG : 0);
  var tx = 0;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#05060a';
  ctx.fillRect(0, 0, L, H);

  var o = versEcran(0, 0);

  var vg = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, Math.max(L, H) * 0.8);
  vg.addColorStop(0, 'rgba(78,52,136,.22)');
  vg.addColorStop(0.44, 'rgba(42,29,78,.11)');
  vg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, L, H);

  dessinerGrilleHex(o);
  dessinerEtoiles(temps);

  /* voile circulaire de la zone mémoire : un disque vu de face */
  var rz = RA.mem1 * etat.zoom * 1.06;
  if (rz > 4) {
    var dg = ctx.createRadialGradient(o.x, o.y, rz * 0.1, o.x, o.y, rz);
    dg.addColorStop(0, 'rgba(40,27,70,.36)');
    dg.addColorStop(0.74, 'rgba(48,33,82,.24)');
    dg.addColorStop(1, 'rgba(20,14,38,0)');
    ctx.fillStyle = dg;
    ctx.beginPath(); ctx.arc(o.x, o.y, rz, 0, TAU); ctx.fill();
  }

  /* ------- 1re passe : position dans le monde (avant respiration) --------- */
  var i, n, marge;
  for (i = 0; i < noeuds.length; i++) {
    n = noeuds[i];
    positionner(n, etat.phase, now, _w3);
    n.wx = _w3.x; n.wy = _w3.y; n.wz = _w3.z;
    n.cache = (n.kind === 'fiche' && etat.replies[n.groupe]);
  }

  /* superposition du drill-down : réécrit les positions des fiches en portée,
     sans toucher au layout de base (remonter le restaure tel quel). */
  appliquerPlongee();

  /* RESPIRATION : chaque galaxie enfle et se contracte de ±2 %, déphasée. */
  for (i = 0; i < groupes.length; i++) {
    groupes[i].resp = 1 + 0.02 * Math.sin(temps * 0.33 + groupes[i].respPhase);
  }

  /* ------- 2e passe : respiration, projection, survol, découpe ------------ */
  var kSurvol = 1 - Math.pow(0.001, dt / 0.15);      // montée en 150 ms
  for (i = 0; i < noeuds.length; i++) {
    n = noeuds[i];
    var wx = n.wx, wy = n.wy, wz = n.wz;
    if (n.kind === 'fiche') {
      var gg = parGroupe[n.groupe];
      if (gg && gg.resp !== 1) {
        var h = gg.hub, sc = gg.resp;
        wx = h.wx + (wx - h.wx) * sc;
        wy = h.wy + (wy - h.wy) * sc;
        wz = h.wz + (wz - h.wz) * sc;
      }
    }
    projeter(wx, wy, wz, _pr);
    n.px = _pr.x; n.py = _pr.y; n.vz = 0; n.k = 1;
    n.sx = (_pr.x - etat.camx) * etat.zoom + L / 2;
    n.sy = (_pr.y - etat.camy) * etat.zoom + H / 2;
    n.brume = 1;                                    // carte plate : tout est net
    n.flou = 0;
    if (n._ha === undefined) n._ha = 0;
    var vise = (n === etat.survol) ? 1 : 0;
    if (n._ha !== vise) {
      n._ha += (vise - n._ha) * kSurvol;
      if (Math.abs(vise - n._ha) < 0.008) n._ha = vise;
    }
    marge = 60 + n.r * etat.zoom;
    n.vis = n.sx > -marge && n.sx < L + marge && n.sy > -marge && n.sy < H + marge;
  }

  var aAnneaux = 1 - partForce;
  if (aAnneaux > 0.01) dessinerAnneaux(aAnneaux, o, tx);
  if (partForce > 0.02) dessinerAmas(partForce, tx);

  var eveille = etat.rotation > 0.001 || (now - etat.derniereInteraction) < 4000;
  dessinerLiens(o);
  semerImpulsions(now, eveille);
  dessinerImpulsions(now);

  /* --------------------------------- nœuds, du fond vers le premier plan */
  for (i = 0; i < ordre.length; i++) {
    n = ordre[i];
    if (!n.vis || n.cache) continue;
    var op = opaciteDe(n);
    if (op < 0.02) continue;
    dessinerNet(n, op, temps, o, aAnneaux);
  }

  if (aAnneaux > 0.01) dessinerLegendes(aAnneaux, o, tx);
  if (etat.pile.length || etat.drillAnim) dessinerPlongee();
  if (etat.noms) dessinerNoms();
  majFilante(now, eveille);

  return camBouge;
}

/* ---------------------------------------------------------- fond hexagonal */

function dessinerGrilleHex(o) {
  var taille = 42 * etat.zoom;
  if (taille < 8) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(154,182,232,.038)';
  ctx.lineWidth = 1;
  var pasX = taille * 1.5, pasY = taille * Math.sqrt(3);
  var c0 = Math.floor((-o.x) / pasX) - 1, c1 = Math.ceil((L - o.x) / pasX) + 1;
  var r0 = Math.floor((-o.y) / pasY) - 2, r1 = Math.ceil((H - o.y) / pasY) + 2;
  if ((c1 - c0) * (r1 - r0) > 4500) { ctx.restore(); return; }
  ctx.beginPath();
  for (var c = c0; c <= c1; c++) {
    for (var r = r0; r <= r1; r++) {
      var x = o.x + c * pasX;
      var y = o.y + r * pasY + (c % 2 ? pasY / 2 : 0);
      for (var k = 0; k < 6; k++) {
        var a = k * Math.PI / 3;
        var px = x + Math.cos(a) * taille, py = y + Math.sin(a) * taille;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }
  }
  ctx.stroke();
  ctx.restore();
}

function dessinerEtoiles(temps) {
  for (var i = 0; i < etoiles.length; i++) {
    var e = etoiles[i];
    var p = etat.zoom * e.par;
    var x = (e.x - etat.camx) * p + L / 2, y = (e.y - etat.camy) * p + H / 2;
    if (x < 0 || x > L || y < 0 || y > H) continue;
    var sc = 0.62 + 0.38 * Math.sin(temps * e.vt + e.ph);
    ctx.fillStyle = 'rgba(200,215,255,' + (e.o * sc).toFixed(3) + ')';
    ctx.fillRect(x, y, e.t, e.t);
  }
}

/* -------------------------------------------------------- anneaux & légendes */

/* Les anneaux sont des cercles du monde centrés sur le noyau, vus DE FACE :
   un simple `arc()` centré à l'origine écran suffit — la rotation du plan ne
   déforme pas un cercle. */
var PAS_ANNEAU = 72;

function anneauGuide(rayon, couleur, alpha, pointille, tx) {
  var R = rayon * etat.zoom;
  if (R < 6 || R > 40000) return;
  var cx = (0 - etat.camx) * etat.zoom + L / 2;
  var cy = (0 - etat.camy) * etat.zoom + H / 2;
  ctx.save();
  ctx.lineWidth = 1;
  if (pointille) ctx.setLineDash([2, 7]);
  ctx.strokeStyle = hexRgba(couleur, alpha);
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, TAU);
  ctx.stroke();
  ctx.restore();
}

/** Ancre d'une légende : juste à l'extérieur de l'anneau, sur un rayon donné.
    Les cercles étant concentriques, on éVENTAILLE les quatre mots sur des
    angles distincts pour qu'ils ne se chevauchent pas sur la ligne médiane. */
function ancreAnneau(rayon, ang) {
  var cx = (0 - etat.camx) * etat.zoom + L / 2;
  var cy = (0 - etat.camy) * etat.zoom + H / 2;
  var R = rayon * etat.zoom + 18;
  return { x: cx + Math.cos(ang) * R, y: cy + Math.sin(ang) * R };
}

function legende(x, y, texte, couleur, alpha) {
  if (y < -20 || y > H + 20 || x < -300 || x > L + 300) return;
  ctx.save();
  ctx.font = '600 13px -apple-system,BlinkMacSystemFont,Helvetica,Arial';
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillStyle = hexRgba(couleur, Math.min(alpha, 0.92));
  ctx.shadowColor = hexRgba(couleur, 0.55); ctx.shadowBlur = 14;
  texteEspace(texte, x, y, 4.6, 'center');
  ctx.restore();
}

function dessinerAnneaux(a, o, tx) {
  anneauGuide(R_SKILL[0], '#ff9d4d', 0.13 * a, true, tx);
  anneauGuide(R_SKILL[1], '#ff9d4d', 0.11 * a, true, tx);
  anneauGuide(R_SKILL[2], '#ff9d4d', 0.30 * a, false, tx);
  anneauGuide(RA.mem1, '#a78bfa', 0.12 * a, true, tx);
  anneauGuide(RA.routines, '#e8c268', 0.42 * a, false, tx);
  anneauGuide(RA.apps, '#7ea8d8', 0.34 * a, false, tx);
}

/** Légendes des anneaux — tracées APRÈS les nœuds pour rester lisibles. */
var DEF_LEGENDES = null;

function dessinerLegendes(a, o, tx) {
  if (!DEF_LEGENDES) DEF_LEGENDES = [
    /* ang : rayon (radians) où poser le mot, éventaillé sur le flanc gauche,
       du haut (skills, anneau serré) vers le bas (applications, large). */
    { r: 'sk', t: 'SKILLS', c: '#ff9d4d', o: 0.90, ang: Math.PI * 0.86 },
    { r: 'me', t: 'MÉMOIRE', c: '#a78bfa', o: 0.85, ang: Math.PI * 1.00 },
    { r: 'ro', t: 'ROUTINES', c: '#e8c268', o: 0.88, ang: Math.PI * 1.12 },
    { r: 'ap', t: 'APPLICATIONS', c: '#7ea8d8', o: 0.88, ang: Math.PI * 1.24 },
  ];
  var rayons = { sk: R_SKILL[2], me: RA.mem1, ro: RA.routines, ap: RA.apps };
  var pos = [], i;
  for (i = 0; i < DEF_LEGENDES.length; i++) {
    var an = ancreAnneau(rayons[DEF_LEGENDES[i].r], DEF_LEGENDES[i].ang);
    an.x = borner(an.x, 90, Math.max(150, L - PANNEAU() - 70));
    an.y = borner(an.y, 30, H - 30);
    pos.push(an);
  }
  /* garde-fou : deux mots trop proches se décalent verticalement */
  for (i = 1; i < pos.length; i++) {
    for (var j = 0; j < i; j++) {
      if (Math.abs(pos[i].x - pos[j].x) < 90 && Math.abs(pos[i].y - pos[j].y) < 17) {
        pos[i].y = pos[j].y + 17;
      }
    }
  }
  for (i = 0; i < DEF_LEGENDES.length; i++) {
    legende(pos[i].x, pos[i].y, DEF_LEGENDES[i].t, DEF_LEGENDES[i].c,
      DEF_LEGENDES[i].o * a);
  }
}

/* ---------------------------- amas non mémoire : leur repère en mode Force */

var AMAS = null;
function dessinerAmas(a, tx) {
  if (!AMAS) AMAS = [
    { ancre: ANCRE_SKILL, oy: 0, txt: 'SKILLS', couleur: '#ff9d4d', glyphe: 'etoile' },
    { ancre: ANCRE_ROUTINE, oy: 0, txt: 'ROUTINES', couleur: '#e8c268', glyphe: 'horloge' },
    { ancre: ANCRE_APP, oy: 118, txt: 'APPLICATIONS', couleur: '#7ea8d8', glyphe: 'hexagone' },
  ];
  ctx.save();
  for (var i = 0; i < AMAS.length; i++) {
    var m = AMAS[i];
    var s = ecranPlan(m.ancre.x, m.ancre.y + m.oy, 0, tx, _e3);
    if (s.x < -120 || s.x > L + 120 || s.y < -60 || s.y > H + 60) continue;
    var R = Math.max(5, 8 * etat.zoom * s.k);
    ctx.globalAlpha = a;
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(halo(m.couleur), s.x - R * 5, s.y - R * 5, R * 10, R * 10);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = m.couleur;
    ctx.beginPath(); ctx.arc(s.x, s.y, R, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(s.x, s.y, R, 0, TAU); ctx.stroke();
    if (R > 6) {
      if (m.glyphe === 'horloge') glypheHorloge(s.x, s.y, R * 0.9, 'rgba(10,13,20,.85)');
      else if (m.glyphe === 'hexagone') {
        cheminHexagone(s.x, s.y, R * 0.5);
        ctx.strokeStyle = 'rgba(10,13,20,.85)'; ctx.lineWidth = Math.max(1, R * 0.14); ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(10,13,20,.85)';
        etoile4(s.x, s.y, R * 0.62, R * 0.2); ctx.fill();
      }
    }
    ctx.font = '700 9.5px -apple-system,Helvetica,Arial';
    ctx.fillStyle = 'rgba(240,246,255,.94)';
    ctx.shadowColor = 'rgba(0,0,0,.95)'; ctx.shadowBlur = 7;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    texteEspace(m.txt, s.x, s.y + R + 13, 1.7, 'center');
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ------------------------------------------------------------------- liens */

function estEnAvant(n) {
  var s = etat.survol || etat.selection;
  if (!s) return false;
  if (s.kind === 'hub') return n.groupe === s.groupe || n === s;
  if (n === s) return true;
  if (n.kind === 'hub' && s.groupe === n.groupe) return true;
  var v = voisins[s.id];
  return !!(v && v.indexOf(n.id) >= 0);
}

function opaciteDe(n) {
  var o = 1;
  if (etat.trouves) o = etat.trouves[n.id] ? 1 : (etat.filtreBrouillons ? 0 : 0.15);
  if (etat.survol || etat.selection) o = estEnAvant(n) ? 1 : Math.min(o, 0.18);
  if (etat.pile.length || etat.drillAnim) {
    var f = etat.drillAnim ? etat.drillMix : 1;
    if (!estDansPlongee(n)) o = Math.min(o, 1 - 0.86 * f);   // le reste de l'univers s'estompe
  }
  return Math.max(Math.min(o, 1), 0);
}

/** Courbe douce entre deux points écran, décalée perpendiculairement. */
function courbe(ax, ay, bx, by, k) {
  var mx = (ax + bx) / 2, my = (ay + by) / 2;
  var dx = bx - ax, dy = by - ay;
  ctx.moveTo(ax, ay);
  ctx.quadraticCurveTo(mx - dy * k, my + dx * k, bx, by);
}

function dessinerLiens(o) {
  var i, l, g, gr, hub, f;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  /* wikiliens au repos : filaments doux */
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(186,202,240,.10)';
  ctx.beginPath();
  for (i = 0; i < liens.length; i++) {
    l = liens[i];
    if (l.a.cache || l.b.cache) continue;
    if ((!l.a.vis && !l.b.vis)) continue;
    if ((etat.survol || etat.selection) && !(estEnAvant(l.a) && estEnAvant(l.b))) continue;
    courbe(l.a.sx, l.a.sy, l.b.sx, l.b.sy, 0.09);
  }
  ctx.stroke();

  /* rayons hub → fiches */
  for (g = 0; g < groupes.length; g++) {
    gr = groupes[g];
    if (etat.replies[gr.cle]) continue;
    hub = gr.hub;
    var fort = (etat.survol && (etat.survol === hub || etat.survol.groupe === gr.cle)) ||
               (etat.selection && (etat.selection === hub || etat.selection.groupe === gr.cle));
    ctx.beginPath();
    ctx.strokeStyle = fort ? hexRgba(gr.couleur, 0.34) : hexRgba(gr.couleur, 0.05);
    ctx.lineWidth = fort ? 1 : 0.8;
    for (i = 0; i < gr.fiches.length; i++) {
      f = parId[gr.fiches[i].id];
      if (!f.vis && !hub.vis) continue;
      ctx.moveTo(hub.sx, hub.sy); ctx.lineTo(f.sx, f.sy);
    }
    ctx.stroke();
  }

  /* noyau → hubs */
  var c = parId['#centre'];
  ctx.strokeStyle = 'rgba(255,180,120,.20)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (g = 0; g < groupes.length; g++) {
    hub = groupes[g].hub;
    courbe(c.sx, c.sy, hub.sx, hub.sy, 0.14);
  }
  ctx.stroke();

  /* --- mise en avant : le nœud actif et son hub, filament coloré bien visible */
  var act = etat.survol || etat.selection;
  if (act && (act.kind === 'fiche' || act.kind === 'hub')) {
    var gh = parGroupe[act.groupe];
    if (gh && act !== gh.hub) {
      ctx.strokeStyle = hexRgba(gh.couleur, 0.85);
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      courbe(act.sx, act.sy, gh.hub.sx, gh.hub.sy, 0.13);
      ctx.stroke();
    }
    if (act.kind === 'fiche') {
      ctx.strokeStyle = 'rgba(255,255,255,.72)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (i = 0; i < liens.length; i++) {
        l = liens[i];
        if (l.a !== act && l.b !== act) continue;
        courbe(l.a.sx, l.a.sy, l.b.sx, l.b.sy, 0.09);
      }
      ctx.stroke();
    }
  }
  ctx.restore();
}

/* ----------------------------------------------------------- nœuds : rayon */

function rayonEcran(n) {
  var z = etat.zoom * (n.k === undefined ? 1 : n.k);
  var sv = 1 + 0.19 * (n._ha || 0);                 // montée au survol
  if (n.kind === 'app') return n.r * Math.max(z, 0.3) * (0.72 + 0.28 * etat.taille) * sv;
  if (n.kind === 'hub') return Math.max(5, n.r * Math.max(z, 0.4) * (0.75 + 0.25 * etat.taille)) * sv;
  if (n.kind === 'centre') return Math.max(9, n.r * Math.max(z, 0.4));
  if (n.kind === 'skill') return n.r * etat.taille * Math.max(z, 0.5) * sv;
  if (n.kind === 'routine') return n.r * etat.taille * Math.max(z, 0.5) * sv;
  var g = (n.gradTaille && etat.layout === 'rings') ? n.gradTaille : 1;
  return Math.max(0.6, n.r * etat.taille * Math.max(z, 0.42) * g) * sv;
}

/* ----------------------------------------------------------- nœuds : nets */

function dessinerNet(n, op, temps, o, aAnneaux) {
  if (n.kind === 'fiche') return dessinerFiche(n, op, temps);
  if (n.kind === 'skill') return dessinerSkill(n, op, temps);
  if (n.kind === 'routine') return dessinerRoutine(n, op, temps);
  if (n.kind === 'app') return dessinerApp(n, op, o, aAnneaux);
  if (n.kind === 'hub') return dessinerHub(n, op, temps);
  if (n.kind === 'centre') return dessinerNoyau(n, temps);
}

function dessinerFiche(n, op, temps) {
  var R = rayonEcran(n);
  var trouve = etat.trouves && etat.trouves[n.id];
  var couleur = trouve ? '#4ade80' : n.couleur;
  ctx.save();
  ctx.globalAlpha = op * (n.brut ? 0.62 : 1);
  ctx.globalCompositeOperation = 'lighter';
  var Rh = R * (n.brut ? 3.2 : 4.6);
  ctx.drawImage(halo(couleur), n.sx - Rh, n.sy - Rh, Rh * 2, Rh * 2);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = op;
  if (n.brut) {
    /* zone brute : plus petite, plus terne, cerclée */
    ctx.strokeStyle = hexRgba(couleur, 0.6); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(n.sx, n.sy, R + 2.1, 0, TAU); ctx.stroke();
    ctx.globalAlpha = op * 0.7;
    ctx.drawImage(bille(couleur), n.sx - R, n.sy - R, R * 2, R * 2);
    ctx.globalAlpha = op;
  } else {
    ctx.drawImage(bille(trouve ? '#4ade80' : couleur), n.sx - R, n.sy - R, R * 2, R * 2);
  }

  /* Brouillon (statut: draft) : halo ambre doux + cerne pointillé franc — repérable
     d'un coup d'œil dans la galaxie, « pas encore validé ». */
  if (n.draft) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.22;
    var Rg = R * 3.2;
    ctx.drawImage(halo('#e8c268'), n.sx - Rg, n.sy - Rg, Rg * 2, Rg * 2);
    ctx.restore();
    ctx.save();
    ctx.setLineDash([3, 3]);
    ctx.strokeStyle = hexRgba('#f0b429', 0.95); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(n.sx, n.sy, R + 4, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  if (etat.selection === n) {
    /* halo pulsant doux — le sujet respire, il n'est pas cerclé de blanc dur */
    var pu = 0.5 + 0.5 * Math.sin(temps * 2.1);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.30 + 0.26 * pu;
    var Rp = R * (5.4 + 1.5 * pu);
    ctx.drawImage(halo(couleur), n.sx - Rp, n.sy - Rp, Rp * 2, Rp * 2);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = op;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.55 + 0.37 * pu).toFixed(2) + ')';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(n.sx, n.sy, R + 4 + 2.4 * pu, 0, TAU); ctx.stroke();
  } else if (etat.survol === n) {
    ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(n.sx, n.sy, R + 5, 0, TAU); ctx.stroke();
  } else if ((etat.survol || etat.selection) && estEnAvant(n)) {
    var sc = 0.5 + 0.5 * Math.sin(temps * 4 + (n.rang || 0));
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.22 + 0.42 * sc).toFixed(2) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(n.sx, n.sy, R + 3.2, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function dessinerSkill(n, op, temps) {
  var scint = 0.78 + 0.3 * Math.sin(temps * 1.9 + (n.graine % 100) * 0.37);
  var R = rayonEcran(n) * scint;
  ctx.save();
  ctx.globalAlpha = op;
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(halo('#ff9d4d'), n.sx - R * 3.4, n.sy - R * 3.4, R * 6.8, R * 6.8);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = (etat.trouves && etat.trouves[n.id]) ? '#bbf7d0' : '#ffb877';
  etoile4(n.sx, n.sy, R * 1.95, R * 0.62);
  ctx.fill();
  if (etat.survol === n || etat.selection === n) {
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(n.sx, n.sy, R * 3, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function dessinerRoutine(n, op, temps) {
  var R = rayonEcran(n), Rorb = R * 2.55;
  ctx.save();
  ctx.globalAlpha = op;
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(halo('#e8c268'), n.sx - R * 4.2, n.sy - R * 4.2, R * 8.4, R * 8.4);
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = hexRgba('#e8c268', 0.62); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(n.sx, n.sy, Rorb, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#e8c268';
  ctx.beginPath(); ctx.arc(n.sx, n.sy, R, 0, TAU); ctx.fill();
  var ang = temps * 0.55 + (n.graine % 360) * 0.017;
  ctx.fillStyle = '#fff0c8';
  ctx.beginPath();
  ctx.arc(n.sx + Math.cos(ang) * Rorb, n.sy + Math.sin(ang) * Rorb, Math.max(1.2, R * 0.24), 0, TAU);
  ctx.fill();
  if (R > 5.5) glypheHorloge(n.sx, n.sy, R, 'rgba(10,13,20,.8)');
  if (etat.survol === n || etat.selection === n) {
    ctx.strokeStyle = 'rgba(255,255,255,.88)'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(n.sx, n.sy, Rorb + 5, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function dessinerApp(n, op, o, aAnneaux) {
  var R = rayonEcran(n);
  ctx.save();
  ctx.globalAlpha = op;
  if (aAnneaux > 0.05) {
    var dx = o.x - n.sx, dy = o.y - n.sy;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    ctx.strokeStyle = 'rgba(126,168,216,' + (0.16 * aAnneaux).toFixed(3) + ')';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(n.sx + dx / d * R, n.sy + dy / d * R);
    ctx.lineTo(n.sx + dx * 0.26, n.sy + dy * 0.26);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(halo('#3d6ea8'), n.sx - R * 2.4, n.sy - R * 2.4, R * 4.8, R * 4.8);
  ctx.globalCompositeOperation = 'source-over';

  var g = ctx.createLinearGradient(n.sx, n.sy - R, n.sx, n.sy + R);
  g.addColorStop(0, 'rgba(104,148,206,.36)');
  g.addColorStop(0.5, 'rgba(32,50,84,.32)');
  g.addColorStop(1, 'rgba(18,28,48,.44)');
  cheminHexagone(n.sx, n.sy, R);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = (etat.survol === n || etat.selection === n)
    ? 'rgba(215,234,255,.95)' : 'rgba(140,182,230,.62)';
  ctx.lineWidth = 1.1; ctx.stroke();
  cheminHexagone(n.sx, n.sy, R * 0.78);
  ctx.strokeStyle = 'rgba(160,196,240,.12)'; ctx.lineWidth = 0.8; ctx.stroke();
  if (R > 9) glypheConnecteur(n.glyphe, n.sx, n.sy, R * 0.46);
  ctx.restore();
}

function dessinerHub(n, op, temps) {
  var gr = parGroupe[n.groupe];
  var R = rayonEcran(n), Rorb = R * 2.2;
  ctx.save();
  ctx.globalAlpha = op;
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(halo(gr.couleur), n.sx - R * 4.6, n.sy - R * 4.6, R * 9.2, R * 9.2);
  ctx.globalCompositeOperation = 'source-over';

  ctx.strokeStyle = hexRgba(gr.couleur, 0.36); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(n.sx, n.sy, Rorb, 0, TAU); ctx.stroke();
  var ang = -temps * 0.4 + (n.graine % 100) * 0.06;
  ctx.fillStyle = hexRgba(gr.couleur, 0.9);
  ctx.beginPath();
  ctx.arc(n.sx + Math.cos(ang) * Rorb, n.sy + Math.sin(ang) * Rorb, Math.max(1.1, R * 0.18), 0, TAU);
  ctx.fill();

  ctx.fillStyle = gr.couleur;
  ctx.beginPath(); ctx.arc(n.sx, n.sy, R, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.38)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(n.sx, n.sy, R, 0, TAU); ctx.stroke();
  if (R > 7) glypheHub(n.sx, n.sy, R * 0.62, gr.source);

  /* bulle du compteur */
  var txt = String(gr.fiches.length);
  ctx.font = '600 9.5px -apple-system,Helvetica,Arial';
  var w = ctx.measureText(txt).width + 10;
  var bx = n.sx + Rorb * 0.76, by = n.sy - Rorb * 0.8;
  ctx.fillStyle = 'rgba(12,16,26,.92)';
  ctx.strokeStyle = hexRgba(gr.couleur, 0.55); ctx.lineWidth = 1;
  arrondi(bx - w / 2, by - 7, w, 14, 7);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = eclaircir(gr.couleur);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, bx, by + 0.5);

  /* étiquette */
  ctx.font = '700 9.5px -apple-system,Helvetica,Arial';
  ctx.fillStyle = 'rgba(240,246,255,.94)';
  ctx.shadowColor = 'rgba(0,0,0,.95)'; ctx.shadowBlur = 7;
  ctx.textAlign = 'left';
  /* alternance dessus/dessous : évite l'empilement des étiquettes voisines */
  var dy = gr.impair ? -(Rorb + 15) : (Rorb + 13);
  texteEspace(courtLabel(gr.label, 18), n.sx, n.sy + dy, 1.7, 'center');
  ctx.shadowBlur = 0;

  if (etat.replies[gr.cle]) {
    ctx.strokeStyle = hexRgba(gr.couleur, 0.5); ctx.lineWidth = 1;
    ctx.setLineDash([2, 4]);
    ctx.beginPath(); ctx.arc(n.sx, n.sy, Rorb * 1.5, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  if (etat.selection === n) {
    var pu = 0.5 + 0.5 * Math.sin(temps * 2.1);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.26 + 0.24 * pu;
    var Rp = R * (4.4 + 1.4 * pu);
    ctx.drawImage(halo(gr.couleur), n.sx - Rp, n.sy - Rp, Rp * 2, Rp * 2);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = op;
    ctx.strokeStyle = '#ff9d4d'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(n.sx, n.sy, R + 4 + 2.2 * pu, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function dessinerNoyau(n, temps) {
  var R = rayonEcran(n);
  var puls = 1 + 0.06 * Math.sin(temps * 1.4);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(halo('#ff9d4d'), n.sx - R * 7 * puls, n.sy - R * 7 * puls, R * 14 * puls, R * 14 * puls);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#ff9d4d';
  ctx.beginPath(); ctx.arc(n.sx, n.sy, R, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,180,.8)'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(n.sx, n.sy, R, 0, TAU); ctx.stroke();
  if (R > 9) glypheNoyau(n.sx, n.sy, R * 0.8);
  ctx.font = '700 10.5px -apple-system,Helvetica,Arial';
  ctx.fillStyle = 'rgba(255,255,255,.96)';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,.95)'; ctx.shadowBlur = 8;
  texteEspace('CLAUDE.MD', n.sx, n.sy + R + 16, 2.8, 'center');
  ctx.restore();
}

function dessinerNoms() {
  if (etat.zoom < 0.25) return;
  ctx.save();
  ctx.font = '9px -apple-system,Helvetica,Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  var montre = 0;
  for (var i = 0; i < noeuds.length; i++) {
    var n = noeuds[i];
    if (n.kind !== 'fiche' || !n.vis || n.cache || n.flou > 0.5) continue;
    var op = opaciteDe(n);
    if (op < 0.5) continue;
    if (montre++ > 900) break;
    ctx.fillStyle = 'rgba(178,192,216,' + (0.44 * op).toFixed(2) + ')';
    ctx.fillText(courtLabel(n.fichier, 26), n.sx, n.sy + rayonEcran(n) + 2);
  }
  ctx.restore();
}

/* ============================================================ interactions */

function noeudSous(sx, sy) {
  var meilleur = null, dmin = 1e9, zmin = 1e9;
  for (var i = 0; i < noeuds.length; i++) {
    var n = noeuds[i];
    if (!n.vis || n.cache) continue;
    if (n.flou > 1.2) continue;                      // trop flou : non cliquable
    var R = rayonEcran(n);
    if (n.kind === 'skill') R *= 2.2;
    else if (n.kind === 'routine') R *= 2.6;
    else R += 4;
    R = Math.max(R, 5);
    var dx = sx - n.sx, dy = sy - n.sy;
    var d = dx * dx + dy * dy;
    if (d >= R * R) continue;
    /* à recouvrement, c'est le nœud LE PLUS PROCHE de la caméra qui gagne */
    if (n.vz < zmin - 1 || (Math.abs(n.vz - zmin) <= 1 && d < dmin)) {
      zmin = Math.min(zmin, n.vz); dmin = d; meilleur = n;
    }
  }
  return meilleur;
}

var tire = false, orbite = false, dernierX = 0, dernierY = 0, aBouge = false;
var boutonPresse = -1, downX = 0, downY = 0;

cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

cv.addEventListener('mousedown', function (e) {
  tire = true; aBouge = false;
  boutonPresse = e.button;
  downX = e.clientX; downY = e.clientY;
  /* Maj ou clic droit : on ORBITE. Glisser normal : on panoramique. */
  orbite = !!e.shiftKey || e.button === 2;
  dernierX = e.clientX; dernierY = e.clientY;
  etat.vol = null;
  cv.classList.add('tire');
});

window.addEventListener('mouseup', function (e) {
  var btn = boutonPresse; boutonPresse = -1;
  tire = false; orbite = false; cv.classList.remove('tire');
  /* clic DROIT sans glisser (< ~4 px) : bascule la pause de l'auto-rotation.
     Avec glissement, c'était une rotation manuelle du plan → rien de plus. */
  if (btn === 2) {
    var dist = Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY);
    if (dist < 4) basculerPause();
  }
});

cv.addEventListener('mousemove', function (e) {
  if (tire) {
    var dx = e.clientX - dernierX, dy = e.clientY - dernierY;
    if (Math.abs(dx) + Math.abs(dy) > 2) aBouge = true;
    if (orbite) {
      /* rotation du plan 2D : le glisser horizontal fait pivoter tout le disque
         autour de son centre (l'auto-rotation est en pause tant qu'on tient). */
      etat.angle += dx * 0.006;
    } else {
      etat.camx -= dx / etat.zoom; etat.camy -= dy / etat.zoom;
      etat.camxC = etat.camx; etat.camyC = etat.camy;
    }
    dernierX = e.clientX; dernierY = e.clientY;
    reveiller();
    return;
  }
  var n = noeudSous(e.clientX, e.clientY);
  if (n !== etat.survol) {
    etat.survol = n;
    if (n) impulserAutour(n, performance.now());
    reveiller();
  }
  majSurvol(e, n);
});

cv.addEventListener('mouseleave', function () {
  etat.survol = null; $('survol').classList.remove('on'); reveiller();
});

cv.addEventListener('wheel', function (e) {
  e.preventDefault();
  etat.vol = null;
  /* le point du monde sous le curseur doit rester sous le curseur */
  var mx = (e.clientX - L / 2) / etat.zoomC + etat.camxC;
  var my = (e.clientY - H / 2) / etat.zoomC + etat.camyC;
  var f = Math.exp(-e.deltaY * 0.0022);
  var z = Math.min(Math.max(etat.zoomC * f, ZOOM_MIN), ZOOM_MAX);
  etat.camxC = mx - (e.clientX - L / 2) / z;
  etat.camyC = my - (e.clientY - H / 2) / z;
  etat.zoomC = z;
  reveiller();
}, { passive: false });

cv.addEventListener('click', function (e) {
  if (aBouge) return;
  var n = noeudSous(e.clientX, e.clientY);
  if (!n) {
    /* clic sur le fond : en plongée, on remonte d'un niveau ; sinon on désélectionne. */
    if (etat.pile.length) { remonter(false); return; }
    etat.selection = null; majFiche(null); fermerLiseuse(); reveiller(); return;
  }
  etat.selection = n;
  impulserAutour(n, performance.now());
  if (n.kind === 'fiche' && MODE === 'relie') { ouvrirLiseuse(n); }
  else { fermerLiseuse(); majFiche(n); }
  reveiller();
});

cv.addEventListener('dblclick', function (e) {
  /* un sous-amas ? on y plonge (récursif). */
  var m = marqueurSous(e.clientX, e.clientY);
  if (m) { descendre(m.cle); return; }
  var n = noeudSous(e.clientX, e.clientY);
  if (n && n.kind === 'hub') { etat.selection = n; entrerGalaxie(n); return; }
  if (n) {
    etat.selection = n;
    if (n.kind === 'fiche' && MODE === 'relie') ouvrirLiseuse(n); else { fermerLiseuse(); majFiche(n); }
    volerVersNoeud(n);
    return;
  }
  /* fond : en plongée, la remontée est gérée par le simple clic ; sinon recadrer. */
  if (!etat.pile.length) recentrer();
});

function majSurvol(e, n) {
  var b = $('survol');
  if (!n) { b.classList.remove('on'); return; }
  var titre = '', meta = '';
  if (n.kind === 'fiche') {
    titre = n.fichier;
    meta = (LIBELLE_SOURCE[n.data.source] || n.data.source) + ' · ' + n.data.zone +
      ' · ↘ ' + n.data.inbound + ' ↗ ' + n.data.outbound;
  } else if (n.kind === 'hub') {
    titre = parGroupe[n.groupe].label;
    meta = n.data.nb + ' fiches · galaxie';
  } else if (n.kind === 'skill') {
    titre = n.label; meta = 'skill · ' + (n.data.scope || '');
  } else if (n.kind === 'routine') {
    titre = n.label; meta = 'routine · ' + (n.data.schedule || n.data.kind || '');
  } else if (n.kind === 'app') {
    titre = n.label;
    meta = 'application · risque ' + ((n.data.risk && n.data.risk.level) || 'inconnu');
  } else {
    titre = 'CLAUDE.md'; meta = 'le manuel opératoire — noyau du système';
  }
  b.innerHTML = '';
  var t = document.createElement('b'); t.textContent = titre;
  var m = document.createElement('div'); m.className = 'm'; m.textContent = meta;
  var a = document.createElement('div'); a.className = 'aide';
  a.textContent = 'clic pour inspecter · double-clic pour voler · Maj+glisser pour pivoter';
  b.appendChild(t); b.appendChild(m); b.appendChild(a);
  b.classList.add('on');
  var x = e.clientX + 16, y = e.clientY + 16;
  if (x + 310 > L) x = e.clientX - 310;
  if (y + 110 > H) y = e.clientY - 100;
  b.style.left = Math.max(6, x) + 'px';
  b.style.top = Math.max(6, y) + 'px';
}
