var cible = null;

function badge(txt, couleur) {
  var s = document.createElement('span');
  s.className = 'badge'; s.style.color = couleur;
  var i = document.createElement('i');
  s.appendChild(i);
  s.appendChild(document.createTextNode(txt));
  return s;
}

function cheminDe(n) {
  if (!n) return '';
  if (n.kind === 'fiche') return n.data.abs || '';
  if (n.kind === 'skill') return n.data.fichier || n.data.path || '';
  if (n.kind === 'routine') return n.data.definition || '';
  if (n.kind === 'centre') return n.data.chemin || '';
  return '';
}

function majFiche(n) {
  var el = $('fiche');
  if (!n) { el.classList.remove('on'); cible = null; return; }
  cible = n;

  $('f-titre').textContent = n.kind === 'hub' ? parGroupe[n.groupe].label
    : (n.kind === 'fiche' ? n.fichier : n.label);

  var bd = $('f-badges'); bd.innerHTML = '';
  var meta = '', chemin = cheminDe(n);

  if (n.kind === 'fiche') {
    var g = parGroupe[n.groupe];
    bd.appendChild(badge(LIBELLE_SOURCE[n.data.source] || n.data.source, g.couleur));
    bd.appendChild(badge(n.data.zone === 'raw' ? 'brut' : (n.data.zone === 'outputs' ? 'livrable' : 'wiki'),
      n.data.zone === 'raw' ? '#e8c268' : '#a78bfa'));
    if (n.data.orphan) bd.appendChild(badge('orpheline', '#f87171'));
    if (n.data.unprocessed) bd.appendChild(badge('non traité', '#f87171'));
    var ext = (n.fichier.indexOf('.') >= 0 ? '.' + n.fichier.split('.').pop() : '');
    meta = octetsFr(n.data.size) + ' · ' + ext + ' · ↘ ' + n.data.inbound + ' ↗ ' + n.data.outbound;
  } else if (n.kind === 'hub') {
    var gg = parGroupe[n.groupe];
    bd.appendChild(badge(gg.fiches.length + ' fiches', gg.couleur));
    bd.appendChild(badge(LIBELLE_SOURCE[gg.source] || gg.source, gg.couleur));
    meta = 'galaxie · double-clic pour zoomer';
  } else if (n.kind === 'skill') {
    bd.appendChild(badge(n.data.scope || 'skill', '#ff9d4d'));
    bd.appendChild(badge(n.data.layer || '—', '#ff9d4d'));
    meta = courtLabel(n.data.description || '', 150);
  } else if (n.kind === 'routine') {
    bd.appendChild(badge(n.data.kind || 'routine', '#e8c268'));
    meta = n.data.schedule || '';
  } else if (n.kind === 'app') {
    bd.appendChild(badge(n.data.transport || '—', '#7ea8d8'));
    bd.appendChild(badge('risque : ' + ((n.data.risk && n.data.risk.level) || 'inconnu'),
      (n.data.risk && n.data.risk.level) === 'action' ? '#f87171' : '#7ea8d8'));
    meta = (n.data.risk && n.data.risk.why) ? courtLabel(n.data.risk.why, 150) : '';
  } else {
    bd.appendChild(badge('noyau', '#ff9d4d'));
    meta = 'manuel opératoire du second cerveau';
  }

  $('f-meta').textContent = meta;
  $('f-chemin').textContent = chemin ? cheminRelatif(chemin) : '—';

  $('a-ouvrir').disabled = !chemin;
  $('a-copier').disabled = !chemin;
  $('a-explorer').style.display = (n.kind === 'hub') ? '' : 'none';
  $('a-lire').style.display = (n.kind === 'fiche' && MODE === 'relie') ? '' : 'none';

  /* âge : demandé au serveur (métadonnée seule, 1 ligne lue) */
  if (MODE === 'relie' && chemin && (n.kind === 'fiche' || n.kind === 'centre')) {
    var courant = n;
    apiGet('/api/file', { path: chemin, from: 1, to: 1 }, function (d) {
      if (cible !== courant || !d) return;
      var age = ageFr(d.modifie);
      if (age) $('f-meta').textContent = octetsFr(d.octets) + ' · ' + age +
        (n.kind === 'fiche' ? ' · ' + (n.fichier.indexOf('.') >= 0 ? '.' + n.fichier.split('.').pop() : '') : '');
    }, function () { /* silencieux : l'âge est un bonus */ });
  }

  /* connexions */
  var cnx = $('f-cnx'); cnx.innerHTML = '';
  var listeIds = [];
  if (n.kind === 'fiche') {
    listeIds = (voisins[n.id] || []).slice(0);
    var g2 = parGroupe[n.groupe];
    if (g2) listeIds.unshift(g2.hub.id);
  } else if (n.kind === 'hub') {
    listeIds = parGroupe[n.groupe].fiches.slice(0, 40).map(function (f) { return f.id; });
  }
  var vus = {}, nb = 0;
  for (var i = 0; i < listeIds.length && nb < 24; i++) {
    var id = listeIds[i];
    if (vus[id] || !parId[id]) continue;
    vus[id] = true; nb++;
    cnx.appendChild(ligneConnexion(parId[id]));
  }
  $('f-cnx-titre').style.display = nb ? '' : 'none';
  el.classList.add('on');
}

function ligneConnexion(v) {
  var b = document.createElement('button');
  var i = document.createElement('i');
  i.style.background = v.kind === 'hub' ? parGroupe[v.groupe].couleur : (v.couleur || '#7ea8d8');
  var s = document.createElement('span');
  s.textContent = v.kind === 'hub' ? parGroupe[v.groupe].label : (v.fichier || v.label);
  b.appendChild(i); b.appendChild(s);
  b.title = 'Voler jusqu’à ce nœud';
  b.onclick = function () { etat.selection = v; majFiche(v); volerVersNoeud(v); };
  return b;
}

function cheminRelatif(abs) {
  var racines = (graphe.sources || []).map(function (s) { return s.root; });
  for (var i = 0; i < racines.length; i++) {
    if (racines[i] && abs.indexOf(racines[i] + '/') === 0) return abs.slice(racines[i].length + 1);
  }
  return abs;
}

function copierRepli(c) {

/* --------------------------------------------------------------- recherche */

function filtrerLocal(q) {
  etat.filtreBrouillons = false;                  // une recherche annule le filtre « brouillons »
  q = q.trim().toLowerCase();
  if (!q) { etat.trouves = null; reveiller(); return; }
  var t = {};
  for (var i = 0; i < noeuds.length; i++) {
    var n = noeuds[i];
    if ((n.label + ' ' + (n.fichier || '') + ' ' + n.id).toLowerCase().indexOf(q) >= 0) t[n.id] = true;
  }
  etat.trouves = t;
  reveiller();
}

/* Retrouve le nœud du graphe correspondant à un résultat /api/search :
   d'abord par identifiant (source/chemin), sinon par chemin absolu. */
function noeudPourResultat(r) {
  if (!r) return null;
  if (r._node) return r._node;
  var id = r.source + '/' + r.file;
  if (parId[id]) return parId[id];
  if (r.abs) {
    for (var k in parId) {
      var nd = parId[k];
      if (nd.data && nd.data.abs && nd.data.abs === r.abs) return nd;
    }
  }
  return null;
}

/* En-tête de section « @@ -12,5 @@ (3 avant, 40 après) » retiré pour l'affichage :
   il est utile à un agent, pas à un lecteur humain. */
function nettoyerSnippet(s) {
  return String(s || '').replace(/^@@\s*-?\d+,\d+\s*@@\s*(\([^)]*\)\s*)?/, '');
}

/* Extrait rendu : échappé (contenu disque, jamais de confiance), puis les **termes**
   marqués par le moteur passent en gras. Rien d'autre n'est interprété. */
function extraitHtml(snippet) {
  var s = echapper(nettoyerSnippet(snippet));
  return s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

function fermerResultats() { var b = $('resultats'); if (b) b.classList.remove('on'); }

/* Ferme le panneau ET rétablit la vue (fin du surlignage des nœuds). */
function fermerRecherche() {
  fermerResultats();
  etat.resultats = null; etat.selResultat = -1; etat.trouves = null;
  etat.filtreBrouillons = false;
  majCompteurBrouillons();                        // restaure le libellé « N brouillons »
  reveiller();
}

function ligneResultat(r, i) {
  var n = noeudPourResultat(r);
  var couleur = COULEUR_SOURCE[r.source] || (n && n.couleur) || '#7ea8d8';
  var libSrc = LIBELLE_SOURCE[r.source] || r.source || '';
  var titre = String(r.file || '').split('/').pop() || r.heading || '(fiche)';

  var b = document.createElement('button');
  b.className = 'res'; b.setAttribute('data-i', i);
  b.title = n ? 'Voler jusqu’à la fiche et l’ouvrir' : 'Fiche absente du graphe';

  var t = document.createElement('div'); t.className = 'res-t';
  var bd = document.createElement('span'); bd.className = 'res-badge'; bd.style.color = couleur;
  var pt = document.createElement('i'); bd.appendChild(pt);
  bd.appendChild(document.createTextNode(courtLabel(libSrc, 16)));
  var tt = document.createElement('span'); tt.className = 'res-titre'; tt.textContent = titre;
  t.appendChild(bd); t.appendChild(tt);
  if (typeof r.score === 'number') {
    var sc = document.createElement('span'); sc.className = 'res-score';
    sc.textContent = (Math.round(r.score * 10) / 10).toString().replace('.', ',');
    t.appendChild(sc);
  }
  b.appendChild(t);

  if (r.snippet) {
    var ex = document.createElement('div'); ex.className = 'res-extrait';
    ex.innerHTML = extraitHtml(r.snippet);
    b.appendChild(ex);
  }
  b.onclick = function () { etat.selResultat = i; majSelResultat(); ouvrirResultat(i); };
  return b;
}

function afficherResultats(q, d) {
  var box = $('resultats'); if (!box) return;
  box.innerHTML = '';
  var res = ((d && d.results) || []).slice(0, 12);
  etat.resultats = res; etat.selResultat = -1;

  var tete = document.createElement('div'); tete.className = 'res-tete';
  if (!res.length) {
    tete.textContent = 'Aucun résultat';
    box.appendChild(tete);
    var vide = document.createElement('div'); vide.className = 'res-vide';
    vide.textContent = 'Reformuler la requête, ou explorer la carte à la main.';
    box.appendChild(vide);
    box.classList.add('on');
    return;
  }
  if (d && d.confidence === 'low') {
    tete.className = 'res-tete faible';
    tete.textContent = res.length + ' résultat(s) · aucun résultat sûr';
  } else {
    tete.textContent = res.length + ' résultat(s)';
  }
  box.appendChild(tete);
  for (var i = 0; i < res.length; i++) box.appendChild(ligneResultat(res[i], i));
  box.classList.add('on');
}

function majSelResultat() {
  var box = $('resultats'); if (!box) return;
  var lignes = box.getElementsByClassName('res');
  for (var i = 0; i < lignes.length; i++) {
    var sel = (+lignes[i].getAttribute('data-i')) === etat.selResultat;
    lignes[i].classList.toggle('sel', sel);
    if (sel && lignes[i].scrollIntoView) lignes[i].scrollIntoView({ block: 'nearest' });
  }
}

function bougerSelectionResultat(delta) {
  var res = etat.resultats; if (!res || !res.length) return;
  var i = etat.selResultat + delta;
  if (i < 0) i = res.length - 1;
  if (i >= res.length) i = 0;
  etat.selResultat = i;
  majSelResultat();
}

function ouvrirResultat(i) {
  var r = etat.resultats && etat.resultats[i]; if (!r) return;
  var n = noeudPourResultat(r);
  if (!n) { toast('Cette fiche n’est pas présente dans le graphe'); return; }
  etat.selection = n;
  if (MODE === 'relie') naviguerVersFiche(n);   // vole + ouvre la liseuse (PDF géré)
  else { volerVersNoeud(n); majFiche(n); }
}

/* Recherche plein texte débouncée : allume les nœuds ET remplit le panneau. */
function lancerRechercheServeur(q) {
  if (!q) return;
  apiGet('/api/search', { q: q, k: 14 }, function (d) {
    if ($('q').value.trim() !== q) return;      // réponse périmée : on l'ignore
    if (!d) { toast('Aucun résultat'); return; }
    var res = d.results || [], t = {}, nb = 0;
    res.forEach(function (r) {
      var n = noeudPourResultat(r);
      if (n && !t[n.id]) { t[n.id] = true; nb++; }
    });
    etat.trouves = nb ? t : null;               // aucun résultat : carte laissée nette
    afficherResultats(q, d);
    reveiller();
  }, function (s, dd) { toast((dd && dd.erreur) || 'Recherche impossible (' + s + ')'); });
}

/* Repli hors ligne (file://) : filtrage par nom, résultats bâtis depuis le graphe. */
function rechercheLocale(q) {
  filtrerLocal(q);
  var ql = q.toLowerCase(), res = [];
  for (var i = 0; i < noeuds.length && res.length < 12; i++) {
    var n = noeuds[i];
    if (n.kind !== 'fiche') continue;
    if ((n.label + ' ' + (n.fichier || '') + ' ' + n.id).toLowerCase().indexOf(ql) < 0) continue;
    res.push({ source: n.data.source, file: n.fichier, abs: n.data.abs, _node: n, snippet: '' });
  }
  afficherResultats(q, { results: res, confidence: 'high' });
}

$('q').addEventListener('input', function () {

/** Retards de la vague : plus un nœud est loin du noyau, plus il part tard. */
function calculerRetards() {
  var i, n, d, dmax = 1;
  for (i = 0; i < noeuds.length; i++) {
    n = noeuds[i];
    d = Math.sqrt((n.wx || 0) * (n.wx || 0) + (n.wy || 0) * (n.wy || 0));
    n._d = d;
    if (d > dmax) dmax = d;
  }
  for (i = 0; i < noeuds.length; i++) noeuds[i].retard = ETALEMENT * (noeuds[i]._d / dmax);
}

/* ============================================================ liseuse (lecture)
   Convertisseur Markdown → HTML maison, sans dépendance. Il ne couvre que ce
   que portent nos fiches (titres, gras/italique, listes, citations, blocs de
   code, callouts, tableaux, wikiliens). TOUT le texte issu du fichier est
   ÉCHAPPÉ : le contenu vient du disque, jamais on ne lui fait confiance pour
   du HTML. Seules les balises que NOUS produisons entrent dans le rendu. */

function echapper(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

var ETIQ_CALLOUT = {
  NOTE: 'Note', INFO: 'Info', TIP: 'Astuce', IMPORTANT: 'Important',
  WARNING: 'Attention', CAUTION: 'Prudence', DANGER: 'Danger',
};

/** Résout un wikilien vers un nœud fiche, en préférant la même source que la
    fiche courante ; renvoie null si aucune fiche ne correspond (lien cassé). */
function resoudreWiki(cible, ctx) {
  var c = String(cible).trim().replace(/\\/g, '/');
  var h = c.indexOf('#'); if (h >= 0) c = c.slice(0, h);
  c = c.trim();
  if (!c) return null;
  if (parId[c] && parId[c].kind === 'fiche') return parId[c];
  var base = c.split('/').pop().replace(/\.(md|markdown|txt|pdf)$/i, '').toLowerCase();
  var arr = indexWiki[base];
  if (!arr || !arr.length) return null;
  if (arr.length === 1) return arr[0];
  if (ctx && ctx.data && ctx.data.source) {
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].data && arr[i].data.source === ctx.data.source) return arr[i];
    }
  }
  return arr[0];
}

/** Rendu des fragments « en ligne » (gras, italique, code, liens, wikiliens).
    On extrait d'abord code/liens/wikiliens en jetons sûrs, on échappe le reste,
    puis on applique gras/italique et on réinjecte les jetons. */
function enligne(txt, ctx) {
  var jetons = [];
  function pousser(html) { jetons.push(html); return '␀' + (jetons.length - 1) + '␀'; }

  txt = String(txt).replace(/`([^`]+)`/g, function (_, c) {
    return pousser('<code>' + echapper(c) + '</code>');
  });
  txt = txt.replace(/\[\[([^\]]+)\]\]/g, function (_, inner) {
    var barre = inner.indexOf('|');
    var cible = (barre >= 0 ? inner.slice(0, barre) : inner).trim();
    var aff = (barre >= 0 ? inner.slice(barre + 1) : inner).trim();
    var node = resoudreWiki(cible, ctx);
    if (node) return pousser('<a class="wl" data-node="' + echapper(node.id) + '">' + echapper(aff) + '</a>');
    return pousser('<span class="wl cassee" title="fiche introuvable">' + echapper(aff) + '</span>');
  });
  txt = txt.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, t, u) {
    if (/^(https?:|mailto:)/i.test(u)) {
      return pousser('<a href="' + echapper(u) + '" target="_blank" rel="noreferrer noopener">' + echapper(t) + '</a>');
    }
    return pousser(echapper(t));
  });

  txt = echapper(txt);
  txt = txt.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  txt = txt.replace(/(^|[^\w*])\*([^*\s][^*]*?)\*(?!\w)/g, '$1<em>$2</em>');
  txt = txt.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  txt = txt.replace(/␀(\d+)␀/g, function (_, i) { return jetons[+i]; });
  return txt;
}

function decoupeLigneTable(l) {
  var s = l.trim().replace(/^\|/, '').replace(/\|$/, '');
  return s.split('|').map(function (c) { return c.trim(); });
}

/** Rend une liste (à puces / numérotée) avec un niveau d'imbrication. */
function rendreListe(rl, ctx) {
  var out = [], ordered = /^\s*\d+[.)]\s/.test(rl[0]);
  out.push(ordered ? '<ol>' : '<ul>');
  var i = 0;
  while (i < rl.length) {
    var m = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(rl[i]);
    if (!m) { i++; continue; }
    var texte = m[3], sous = [];
    i++;
    while (i < rl.length) {
      var m2 = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(rl[i]);
      if (m2) {
        var ind2 = m2[1].replace(/\t/g, '  ').length;
        if (ind2 >= 2) { sous.push(rl[i].replace(/^\s{2}/, '')); i++; continue; }
        break;
      }
      if (/^\s{2,}\S/.test(rl[i])) { texte += ' ' + rl[i].trim(); i++; continue; }
      break;
    }
    var li = '<li>' + enligne(texte, ctx);
    if (sous.length) li += rendreListe(sous, ctx);
    li += '</li>';
    out.push(li);
  }
  out.push(ordered ? '</ol>' : '</ul>');
  return out.join('');
}

function mdToHtml(src, ctx) {
  var lignes = String(src).replace(/\r\n?/g, '\n').split('\n');
  var out = [], i = 0, n = lignes.length;

  if (lignes[0] !== undefined && lignes[0].trim() === '---') {   // frontmatter YAML : ignoré
    var j = 1; while (j < n && lignes[j].trim() !== '---') j++;
    if (j < n) i = j + 1;
  }

  var estListe = function (s) { return /^\s*([-*+]\s+|\d+[.)]\s+)/.test(s); };
  var estHr = function (s) { return /^(-{3,}|\*{3,}|_{3,})$/.test(s); };

  for (; i < n; i++) {
    var l = lignes[i], t = l.trim();

    if (/^```/.test(t)) {                                        // bloc de code
      var buf = []; i++;
      while (i < n && !/^```/.test(lignes[i].trim())) { buf.push(lignes[i]); i++; }
      out.push('<pre><code>' + echapper(buf.join('\n')) + '</code></pre>');
      continue;
    }
    if (t === '') continue;

    var mh = /^(#{1,6})\s+(.*)$/.exec(t);                        // titre
    if (mh) { var niv = mh[1].length; out.push('<h' + niv + '>' + enligne(mh[2], ctx) + '</h' + niv + '>'); continue; }

    if (estHr(t)) { out.push('<hr>'); continue; }

    var mc = /^>\s*\[!(\w+)\]\s*(.*)$/.exec(t);                  // callout
    if (mc) {
      var typ = mc[1].toUpperCase(), titre = mc[2], cb = [];
      i++;
      while (i < n && /^\s*>/.test(lignes[i])) { cb.push(lignes[i].replace(/^\s*>\s?/, '')); i++; }
      i--;
      out.push('<div class="callout callout-' + typ.toLowerCase() + '"><div class="callout-t">' +
        echapper(ETIQ_CALLOUT[typ] || typ) + (titre ? ' — ' + enligne(titre, ctx) : '') + '</div>' +
        (cb.length ? mdToHtml(cb.join('\n'), ctx) : '') + '</div>');
      continue;
    }

    if (/^\s*>/.test(l)) {                                       // citation
      var qb = [];
      while (i < n && /^\s*>/.test(lignes[i])) { qb.push(lignes[i].replace(/^\s*>\s?/, '')); i++; }
      i--;
      out.push('<blockquote>' + mdToHtml(qb.join('\n'), ctx) + '</blockquote>');
      continue;
    }

    if (/\|/.test(l) && i + 1 < n &&                            // tableau
        /^\s*\|?\s*:?-{1,}:?\s*(\|\s*:?-{1,}:?\s*)+\|?\s*$/.test(lignes[i + 1])) {
      var head = decoupeLigneTable(l); i += 2; var rows = [];
      while (i < n && lignes[i].indexOf('|') >= 0 && lignes[i].trim() !== '') { rows.push(decoupeLigneTable(lignes[i])); i++; }
      i--;
      var th = '<tr>' + head.map(function (c) { return '<th>' + enligne(c, ctx) + '</th>'; }).join('') + '</tr>';
      var tb = rows.map(function (r) {
        return '<tr>' + r.map(function (c) { return '<td>' + enligne(c, ctx) + '</td>'; }).join('') + '</tr>';
      }).join('');
      out.push('<table><thead>' + th + '</thead><tbody>' + tb + '</tbody></table>');
      continue;
    }

    if (estListe(l)) {                                          // liste
      var lb = [];
      while (i < n) {
        if (estListe(lignes[i]) || /^\s{2,}\S/.test(lignes[i])) { lb.push(lignes[i]); i++; }
        else if (lignes[i].trim() === '' && i + 1 < n && estListe(lignes[i + 1])) { i++; }
        else break;
      }
      i--;
      out.push(rendreListe(lb, ctx));
      continue;
    }

    var par = [l];                                             // paragraphe
    while (i + 1 < n) {
      var nx = lignes[i + 1], nt = nx.trim();
      if (nt === '' || /^(#{1,6})\s/.test(nt) || /^```/.test(nt) || /^\s*>/.test(nx) ||
          estListe(nx) || estHr(nt) || nx.indexOf('|') >= 0) break;
      par.push(nx); i++;
    }
    out.push('<p>' + enligne(par.join(' '), ctx) + '</p>');
  }
  return out.join('\n');
}

/* ---------------------------------------------------- panneau de lecture (DOM) */

function estPdf(n) { return !!(n && (/\.pdf$/i.test(n.id) || /\.pdf$/i.test((n.data && n.data.abs) || ''))); }

function noteTronque(d) {

function majRetroliens(n) {

function cablerLiensLiseuse() {
  var corps = $('lz-corps');

}

function ouvrirLiseuse(n) {
  if (!n || n.kind !== 'fiche') return;
  etat.ficheLue = n;
  etat.selection = n;
  reinitTrouver();                               // nouvelle fiche : recherche intra-fiche à zéro
  var g = parGroupe[n.groupe];

  $('lz-titre').textContent = n.fichier;
  var bd = $('lz-badges'); bd.innerHTML = '';
  bd.appendChild(badge(LIBELLE_SOURCE[n.data.source] || n.data.source, (g && g.couleur) || '#7ea8d8'));
  bd.appendChild(badge(n.data.zone === 'raw' ? 'brut' : (n.data.zone === 'outputs' ? 'livrable' : 'wiki'),
    n.data.zone === 'raw' ? '#e8c268' : '#a78bfa'));
  if (estPdf(n)) bd.appendChild(badge('PDF', '#f59e0b'));
  var ext = (n.fichier.indexOf('.') >= 0 ? '.' + n.fichier.split('.').pop() : '');
  $('lz-meta').textContent = octetsFr(n.data.size) + ' · ' + ext +

  $('lz-chemin').textContent = chemin ? cheminRelatif(chemin) : '—';
  $('lz-finder').textContent = estPdf(n) ? 'Ouvrir le PDF (Finder)' : 'Révéler dans le Finder';
  var estFantome = !chemin;                       // wikilien sans cible : aucun fichier derrière
  if (estFantome) bd.appendChild(badge('fantôme', '#f87171'));
  $('lz-editeur').style.display = (estPdf(n) || estFantome) ? 'none' : '';
  $('lz-editer').style.display = (estPdf(n) || estFantome) ? 'none' : '';   // pas d'édition d'un PDF ou d'un fantôme
  $('lz-finder').style.display = estFantome ? 'none' : '';
  $('lz-supprimer').style.display = (estPdf(n) || estFantome) ? 'none' : '';  // .md seulement
  reinitConfirmSuppr();                           // on repart toujours sans confirmation armée
  etat.edition = null;                            // on repart toujours en mode lecture

      'simplement aucun fichier à lire ici.</p></div>';

function chargerMarkdown(n) {

/* ---- Éditeur intégré : éditer le Markdown d'une fiche dans la liseuse et
   l'enregistrer via POST /api/save (confiné, .md, copie de secours dans
   .brain/edits/, écriture atomique). Bloqué si la fiche a été TRONQUÉE au
   chargement : on ne réenregistre jamais un contenu partiel. La sauvegarde
   modifie le fichier → le fs.watch du serveur relance l'indexation tout seul. */
function entrerEdition() {
  var n = etat.ficheLue; if (!n || estPdf(n) || MODE !== 'relie') return;
  var chemin = cheminDe(n); if (!chemin) return;
  apiGet('/api/file', { path: chemin, from: 1, to: 4000 }, function (d) {
    if (etat.ficheLue !== n) return;

    if (d.tronque) { toast('Fiche trop longue pour l’édition intégrée — ouvrir dans l’éditeur.'); return; }
    etat.edition = n;
    var corps = $('lz-corps'); corps.innerHTML = '';
    var barre = document.createElement('div');
    barre.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap';
    var save = document.createElement('button'); save.className = 'bt'; save.textContent = '💾 Enregistrer';
    var annul = document.createElement('button'); annul.className = 'bt'; annul.textContent = 'Annuler';
    var info = document.createElement('span');

    barre.appendChild(save); barre.appendChild(annul); barre.appendChild(info);

  });
}

function chargerPdf(n) {

/* ------------------------------------------ boucle de relecture des brouillons
   Une fiche « statut: draft » porte un bandeau bien visible dans la liseuse et un
   bouton « Promouvoir en canon » (POST /api/promote). Le statut est lu à la volée
   dans le frontmatter du Markdown chargé — toujours à jour, même si le graphe ne
   le connaît pas encore. En mode dégradé (file://), le bouton est caché : pas de
   serveur, pas de promotion. */

function statutDuMarkdown(src) {
  var l = String(src).replace(/\r\n?/g, '\n').split('\n');
  if (l[0] !== '---') return null;
  for (var i = 1; i < l.length; i++) {
    if (l[i] === '---' || l[i] === '...') break;
    var m = /^statut\s*:\s*['"]?([A-Za-z]+)/.exec(l[i]);
    if (m) { var v = m[1].toLowerCase(); return (v === 'draft' || v === 'canon') ? v : null; }
  }
  return null;
}

function majBandeauBrouillon(n, statut) {
  var el = $('lz-brouillon'); if (!el) return;
  if (n && n.data) n.data.statut = statut;      // synchronise nœud, compteur et cerne
  if (n) n.draft = (statut === 'draft');
  var estDraft = (statut === 'draft');
  el.style.display = estDraft ? '' : 'none';
  if (estDraft) {
    var btn = $('lz-promouvoir'), txt = $('lz-brouillon-txt');
    if (MODE === 'relie') {
      btn.style.display = ''; btn.disabled = false;
      txt.textContent = 'Brouillon — à relire';
    } else {
      btn.style.display = 'none';
      txt.textContent = 'Brouillon — promotion impossible hors ligne';
    }
  }
  majCompteurBrouillons();
}

function majCompteurBrouillons() {
  var pill = $('brouillons-pill'); if (!pill) return;
  var nb = 0;
  for (var i = 0; i < noeuds.length; i++) {
    var n = noeuds[i];
    if (n.kind === 'fiche' && n.data && n.data.statut === 'draft') nb++;
  }
  if (nb > 0) {
    pill.textContent = nb + ' brouillon' + (nb > 1 ? 's' : '');
    pill.style.display = '';
  } else pill.style.display = 'none';
}

/* Liste les brouillons dans le panneau de résultats (réutilisé tel quel) et les
   surligne sur la carte. */
function listerBrouillons() {
  if (etat.filtreBrouillons) { fermerRecherche(); return; }   // bascule OFF : tout réafficher
  var res = [], t = {};
  for (var i = 0; i < noeuds.length; i++) {
    var n = noeuds[i];
    if (n.kind !== 'fiche' || !(n.data && n.data.statut === 'draft')) continue;
    res.push({ source: n.data.source, file: n.fichier, abs: n.data.abs, _node: n, snippet: '' });
    t[n.id] = true;
  }
  if (!res.length) { toast('Aucun brouillon à relire'); return; }
  etat.filtreBrouillons = true;                    // le reste de l'univers est MASQUÉ (opacité 0)
  etat.trouves = t;
  var pill = $('brouillons-pill'); if (pill) pill.textContent = '✓ brouillons seuls — tout afficher';
  afficherResultats('brouillons', { results: res, confidence: 'high' });
  reveiller();
}

function naviguerVersFiche(n) {
  if (!n || n.kind !== 'fiche') return;
  etat.selection = n;
  /* cible hors du sous-univers actuellement plongé : on remonte à l'ensemble
     pour que sa position de base redevienne valide. */
  if (etat.pile.length && !n._off) remonterA(0);
  if (n._off && etat.galaxie) {
    var hub = etat.galaxie.hub;
    majOrientation();
    projeter(hub.wx + n._off.dx, hub.wy + n._off.dy, 0, _pr);
    volerVers(_pr.x, _pr.y, Math.max(2.5, Math.min(16, 70 / Math.max(n.r, 2))));
  } else volerVersNoeud(n);
  if (MODE === 'relie') ouvrirLiseuse(n); else majFiche(n);
  reveiller();
}

/* ------------------------------------------ recherche DANS la fiche (liseuse)
   Surligne toutes les occurrences du texte rendu, insensible à la casse ET aux
   accents, avec compteur « 3/7 » et navigation précédent/suivant. On n'altère
   que des nœuds texte (jamais la structure) : les wikiliens et le rendu restent
   intacts — un [[lien]] dont le libellé contient le terme reste cliquable. */

function plier(s) {
  return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function majCompteurTrouver() {
  var el = $('lz-compteur'); if (!el) return;
  var q = $('lz-q') ? $('lz-q').value.trim() : '';
  var tot = etat.lzHits ? etat.lzHits.length : 0;
  el.textContent = !q ? '' : (tot ? ((etat.lzHitIdx + 1) + '/' + tot) : '0');
}

function effacerSurlignage() {
  var corps = $('lz-corps'); if (!corps) return;
  var marks = corps.querySelectorAll('mark.lz-hit');
  for (var i = 0; i < marks.length; i++) {
    var m = marks[i], p = m.parentNode;
    if (!p) continue;
    p.replaceChild(document.createTextNode(m.textContent), m);
    p.normalize();
  }
  etat.lzHits = null; etat.lzHitIdx = -1;
}

function reinitTrouver() {
  effacerSurlignage();
  var lq = $('lz-q'); if (lq) lq.value = '';
  majCompteurTrouver();
}

function activerHit(i, defiler) {
  var hits = etat.lzHits; if (!hits || !hits.length) return;
  if (etat.lzHitIdx >= 0 && hits[etat.lzHitIdx]) hits[etat.lzHitIdx].classList.remove('actif');
  if (i < 0) i = hits.length - 1;
  if (i >= hits.length) i = 0;
  etat.lzHitIdx = i;
  var m = hits[i]; m.classList.add('actif');
  if (defiler && m.scrollIntoView) m.scrollIntoView({ block: 'center', behavior: 'smooth' });
  majCompteurTrouver();
}

function trouverDansFiche(d) {
  if (!etat.lzHits || !etat.lzHits.length) return;
  activerHit(etat.lzHitIdx + d, true);
}

function surlignerDansFiche(q) {
  effacerSurlignage();
  var corps = $('lz-corps');
  q = (q || '').trim();
  var fq = plier(q);
  if (!corps || !fq) { majCompteurTrouver(); return; }

  var walker = document.createTreeWalker(corps, NodeFilter.SHOW_TEXT, null, false);
  var textNodes = [], tn;
  while ((tn = walker.nextNode())) { if (tn.nodeValue) textNodes.push(tn); }

  var hits = [];
  textNodes.forEach(function (node) {
    var V = node.nodeValue;
    /* pliage caractère par caractère : chaque position pliée retient l'index
       ORIGINAL, ce qui rétablit exactement la tranche à surligner malgré les
       accents décomposés. */
    var folded = '', map = [], i, j;
    for (i = 0; i < V.length; i++) {
      var f = plier(V[i]);
      for (j = 0; j < f.length; j++) { folded += f[j]; map.push(i); }
    }
    var idx = folded.indexOf(fq);
    if (idx < 0) return;
    var frag = document.createDocumentFragment(), last = 0;
    while (idx >= 0) {
      var oStart = map[idx], oEnd = map[idx + fq.length - 1] + 1;
      if (oStart > last) frag.appendChild(document.createTextNode(V.slice(last, oStart)));
      var mk = document.createElement('mark');
      mk.className = 'lz-hit'; mk.textContent = V.slice(oStart, oEnd);
      frag.appendChild(mk); hits.push(mk);
      last = oEnd;
      idx = folded.indexOf(fq, idx + fq.length);
    }
    if (last < V.length) frag.appendChild(document.createTextNode(V.slice(last)));
    if (node.parentNode) node.parentNode.replaceChild(frag, node);
  });

  etat.lzHits = hits;
  etat.lzHitIdx = -1;
  if (hits.length) activerHit(0, false);        // 1re occurrence marquée, sans défiler
  else majCompteurTrouver();
}

$('lz-q').addEventListener('input', function () { surlignerDansFiche(this.value); });
$('lz-q').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); trouverDansFiche(e.shiftKey ? -1 : 1); return; }
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); reinitTrouver(); this.blur(); }
});
$('lz-suiv').onclick = function () { trouverDansFiche(1); };
$('lz-prec').onclick = function () { trouverDansFiche(-1); };

/* ================================================= drill-down récursif (galaxies)
   Double-cliquer une galaxie la fait PLONGER : ses fiches s'éclatent en sous-amas
   par sous-dossier de premier niveau (le critère le plus utile ici — cf. les
   sous-dossiers fiches/ raw/ des sources), avec repli par PRÉFIXE de
   nom quand un niveau est plat (ex. un dossier plat de fiches se regroupe par
   préfixe commun). C'est RÉCURSIF (double-clic sur un sous-amas y plonge à son tour) et
   CONTEXTUEL (déployer/replier agissent sur le niveau courant). La disposition
   de base n'est jamais recalculée : on ne fait que SUPERPOSER des positions ;
   remonter la restaure telle quelle. */

function libelleSousAmas(k) { return k === '(racine)' ? 'racine' : k; }

/** Profondeur de segments commune à toutes les fiches (hors nom de fichier). */
function profCommune(fiches) {
  if (!fiches.length) return 1;
  var parts = fiches.map(function (f) { return f.id.split('/'); });
  var p = 0;
  for (;;) {
    if (p >= parts[0].length - 1) break;
    var s = parts[0][p], ok = true;
    for (var i = 1; i < parts.length; i++) {
      if (parts[i].length - 1 <= p || parts[i][p] !== s) { ok = false; break; }
    }
    if (!ok) break;
    p++;
  }
  return Math.max(p, 1);
}

/** Décide le regroupement d'un ensemble de fiches à la profondeur `prof` :
    par sous-dossier suivant, sinon par préfixe de nom, sinon terminal (null). */
function grouper(fiches, prof) {
  var folders = {}, leaves = [], anyFolder = false, k;
  for (var i = 0; i < fiches.length; i++) {
    var segs = fiches[i].id.split('/');
    if (segs.length > prof + 1) { k = segs[prof]; (folders[k] || (folders[k] = [])).push(fiches[i]); anyFolder = true; }
    else leaves.push(fiches[i]);
  }
  if (anyFolder) return { typ: 'folder', clusters: folders, leaves: leaves };

  var groupes2 = {};
  for (i = 0; i < fiches.length; i++) {
    var nom = (fiches[i].fichier || nomFichier(fiches[i].id)).replace(/\.[^.]+$/, '');
    var tok = (nom.split(/[-_ ]/)[0] || nom).toLowerCase();
    (groupes2[tok] || (groupes2[tok] = [])).push(fiches[i]);
  }
  var cles = Object.keys(groupes2);
  var multi = cles.filter(function (c) { return groupes2[c].length > 1; }).length;
  if (fiches.length > 8 && cles.length > 1 && multi >= 1) {
    var clusters = {}, lv = [];
    cles.forEach(function (c) { if (groupes2[c].length > 1) clusters[c] = groupes2[c]; else lv.push(groupes2[c][0]); });
    return { typ: 'prefixe', clusters: clusters, leaves: lv };
  }
  return null;
}

function faireFrame(label, couleur, source, fiches, prof) {
  return { label: label, couleur: couleur, source: source, fiches: fiches, prof: prof, grp: grouper(fiches, prof) };
}

function capturerFrom() {
  for (var i = 0; i < memoire.length; i++) {
    var m = memoire[i];
    if (m.kind === 'fiche' && m.wx !== undefined) { m._fromx = m.wx; m._fromy = m.wy; }
  }
}

/** Recalcule les décalages (_off) des fiches en portée du frame courant et les
    marqueurs de sous-amas. Positions RELATIVES au hub de la galaxie plongée. */
function recomputerOffsets() {
  etat.marqueurs = [];
  for (var i = 0; i < memoire.length; i++) if (memoire[i].kind === 'fiche') memoire[i]._off = null;
  var top = etat.pile.length ? etat.pile[etat.pile.length - 1] : null;
  if (!top) return;

  var clusters = (top.grp && top.grp.clusters) ? top.grp.clusters : {};
  var leaves = (top.grp && top.grp.leaves) ? top.grp.leaves : (top.grp ? [] : top.fiches.slice());
  var cles = Object.keys(clusters);
  cles.sort(function (a, b) { return clusters[b].length - clusters[a].length || (a < b ? -1 : 1); });

  var esp = 12;
  var rint = function (cnt) { return 12 + esp * Math.sqrt(Math.max(cnt, 1)) * 0.92; };
  var K = cles.length;
  var Rk = cles.map(function (k) { return rint(clusters[k].length); });
  var maxR = Rk.length ? Math.max.apply(null, Rk) : 1;
  var Rring = K > 1 ? Math.max(maxR / Math.sin(Math.PI / K) * 1.14, maxR * 1.5) : 0;
  var Rleaf = leaves.length ? rint(leaves.length) : 0;
  if (K > 0 && leaves.length) Rring = Math.max(Rring, Rleaf + maxR + esp * 2);

  cles.forEach(function (k, ci) {
    var ang = -Math.PI / 2 + (K ? ci / K : 0) * TAU;
    var cx = Math.cos(ang) * Rring, cy = Math.sin(ang) * Rring;
    clusters[k].forEach(function (f, j) {
      var pa = j * 2.399963, pr = esp * Math.sqrt(j + 0.5);
      f._off = { dx: cx + Math.cos(pa) * pr, dy: cy + Math.sin(pa) * pr };
    });
    etat.marqueurs.push({
      dx: cx, dy: cy, cle: k, label: libelleSousAmas(k),
      count: clusters[k].length, couleur: top.couleur, r: rint(clusters[k].length),
    });
  });
  leaves.forEach(function (f, j) {
    var pa = j * 2.399963, pr = esp * Math.sqrt(j + 0.5) * (K > 0 ? 0.78 : 1);
    f._off = { dx: Math.cos(pa) * pr, dy: Math.sin(pa) * pr };
  });
}

function demarrerDrillAnim() { etat.drillAnim = true; etat.drillT0 = performance.now(); reveiller(); }

function flyToPlongee() {
  var hub = etat.galaxie ? etat.galaxie.hub : null; if (!hub) return;
  var Rtot = 40;
  for (var i = 0; i < memoire.length; i++) {
    var m = memoire[i];
    if (m._off) { var d = Math.sqrt(m._off.dx * m._off.dx + m._off.dy * m._off.dy) + (m.r || 3); if (d > Rtot) Rtot = d; }
  }
  majOrientation();
  resoudre(hub, etat.layout, etat.phase, _w3);
  projeter(_w3.x, _w3.y, _w3.z, _pr);
  var z = Math.min(Math.max(Math.min(L, H) * 0.42 / (Rtot + 24), ZOOM_MIN), ZOOM_MAX);
  volerVers(_pr.x, _pr.y, z, 640);
}

function entrerGalaxie(hub) {
  if (!hub || hub.kind !== 'hub') return;
  var g = parGroupe[hub.groupe]; if (!g) return;
  if (!etat.pile.length) etat.avantPlongee = { camx: etat.camxC, camy: etat.camyC, zoom: etat.zoomC };
  etat.replies[g.cle] = false;
  var fiches = g.fiches.map(function (f) { return parId[f.id]; }).filter(Boolean);
  var prof = profCommune(fiches);
  capturerFrom();
  etat.galaxie = g;
  etat.pile = [faireFrame(g.label, g.couleur, g.source, fiches, prof)];
  recomputerOffsets();
  demarrerDrillAnim(); flyToPlongee();
  majFiche(null); fermerLiseuse();
  majFilDariane(); majBoutonsGalaxie();
  toast('Plongée : ' + g.label);
}

function descendre(cle) {
  var top = etat.pile.length ? etat.pile[etat.pile.length - 1] : null;
  if (!top || !top.grp || !top.grp.clusters[cle]) return;
  var sous = top.grp.clusters[cle];
  var prof2 = top.grp.typ === 'folder' ? top.prof + 1 : top.prof;
  capturerFrom();
  etat.pile.push(faireFrame(libelleSousAmas(cle), top.couleur, top.source, sous, prof2));
  recomputerOffsets();
  demarrerDrillAnim(); flyToPlongee();
  majFilDariane(); majBoutonsGalaxie();
}

function aplatirNiveau() {
  var top = etat.pile.length ? etat.pile[etat.pile.length - 1] : null;
  if (!top) return;
  if (!top.grp || !Object.keys(top.grp.clusters).length) { toast('Déjà au niveau des fiches'); return; }
  capturerFrom();
  top.grp = null;
  recomputerOffsets();
  demarrerDrillAnim(); majBoutonsGalaxie();
  toast('Sous-amas déployés');
}

function remonter(force) {
  var now = performance.now();
  if (!force && now - etat.dernierRemonte < 320) return;
  etat.dernierRemonte = now;
  if (!etat.pile.length) return;
  capturerFrom();
  etat.pile.pop();
  if (!etat.pile.length) {
    etat.galaxie = null;
    recomputerOffsets();
    demarrerDrillAnim();
    if (etat.avantPlongee) volerVers(etat.avantPlongee.camx, etat.avantPlongee.camy, etat.avantPlongee.zoom, 620);
    else recentrer();
  } else {
    recomputerOffsets();
    demarrerDrillAnim(); flyToPlongee();
  }
  majFilDariane(); majBoutonsGalaxie();
}

function remonterA(profondeur) {
  var garde = 0;
  while (etat.pile.length > profondeur && garde++ < 40) remonter(true);
}

function estDansPlongee(n) {
  if (!etat.galaxie) return true;                 // pendant la remontée finale : tout revient
  if (n.kind === 'fiche') return !!n._off;
  if (n.kind === 'hub') return parGroupe[n.groupe] === etat.galaxie;
  if (n.kind === 'centre') return true;
  return false;
}

/** Superpose les positions du drill après le calcul du layout de base. */
function appliquerPlongee() {
  if (!etat.pile.length && !etat.drillAnim) return;
  var mix = etat.drillMix;
  var hub = etat.galaxie ? etat.galaxie.hub : null;
  var ax = hub ? hub.wx : 0, ay = hub ? hub.wy : 0;
  for (var i = 0; i < memoire.length; i++) {
    var n = memoire[i];
    if (n.kind !== 'fiche') continue;
    var tx, ty;
    if (n._off) { tx = ax + n._off.dx; ty = ay + n._off.dy; }
    else { tx = n.wx; ty = n.wy; }
    if (etat.drillAnim) {
      var fx = n._fromx === undefined ? tx : n._fromx;
      var fy = n._fromy === undefined ? ty : n._fromy;
      n.wx = fx + (tx - fx) * mix; n.wy = fy + (ty - fy) * mix;
    } else { n.wx = tx; n.wy = ty; }
  }
}

/** Marqueurs des sous-amas : disque doux + étiquette (nom + compte), cliquables. */
function dessinerPlongee() {
  if (!etat.pile.length) { for (var z = 0; z < etat.marqueurs.length; z++) etat.marqueurs[z].sx = -9999; return; }
  var hub = etat.galaxie ? etat.galaxie.hub : null; if (!hub) return;
  var a = etat.drillAnim ? etat.drillMix : 1;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (var i = 0; i < etat.marqueurs.length; i++) {
    var m = etat.marqueurs[i];
    projeter(hub.wx + m.dx, hub.wy + m.dy, 0, _pr);
    var sx = (_pr.x - etat.camx) * etat.zoom + L / 2;
    var sy = (_pr.y - etat.camy) * etat.zoom + H / 2;
    m.sx = sx; m.sy = sy;
    var R = Math.max(9, m.r * etat.zoom * 0.34);
    ctx.globalAlpha = a;
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(halo(m.couleur), sx - R * 3, sy - R * 3, R * 6, R * 6);
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = hexRgba(m.couleur, 0.7); ctx.lineWidth = 1.4;
    ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    /* étiquette */
    ctx.font = '700 11px -apple-system,Helvetica,Arial';
    ctx.fillStyle = 'rgba(240,246,255,.96)';
    ctx.shadowColor = 'rgba(0,0,0,.95)'; ctx.shadowBlur = 8;
    ctx.fillText(courtLabel(libelleSousAmas(m.label), 22) + '  ·  ' + m.count, sx, sy - R - 11);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function marqueurSous(sx, sy) {
  if (!etat.pile.length) return null;
  var meilleur = null, dmin = 1e9;
  for (var i = 0; i < etat.marqueurs.length; i++) {
    var m = etat.marqueurs[i];
    if (m.sx === undefined || m.sx < -9000) continue;
    var R = Math.max(m.r * etat.zoom * 0.34, 22);
    var dx = sx - m.sx, dy = sy - m.sy, d = dx * dx + dy * dy;
    if (d < R * R && d < dmin) { dmin = d; meilleur = m; }
  }
  return meilleur;
}

/* ------------------------------------------------------------- fil d'ariane */

function majFilDariane() {
  var el = $('fildariane'); if (!el) return;
  if (!etat.pile.length) { el.classList.remove('on'); el.innerHTML = ''; return; }
  var html = '<button data-p="0">← Univers</button>';
  etat.pile.forEach(function (fr, idx) {
    html += '<span class="sep">/</span><button data-p="' + (idx + 1) + '">' +
      echapper(courtLabel(libelleSousAmas(fr.label), 22)) + '</button>';
  });
  el.innerHTML = html; el.classList.add('on');
}

$('fildariane').addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('button') : null;
  if (!b) return;
  remonterA(parseInt(b.getAttribute('data-p'), 10) || 0);
});

function majBoutonsGalaxie() {
  var dep = $('b-deployer'), rep = $('b-replier');
  if (!dep || !rep) return;
  if (etat.pile.length) { dep.textContent = 'Déployer'; rep.textContent = 'Remonter'; }
  else { dep.textContent = 'Tout déployer'; rep.textContent = 'Tout replier'; }
}

/* ========================================================= plein écran & pause */

function elementPleinEcran() {
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}

function basculerPleinEcran() {
  var el = document.documentElement;
  if (!elementPleinEcran()) {
    var demande = el.requestFullscreen || el.webkitRequestFullscreen;
    if (demande) { try { demande.call(el); } catch (e) { /* ignoré */ } }
  } else {
    var sortie = document.exitFullscreen || document.webkitExitFullscreen;
    if (sortie) { try { sortie.call(document); } catch (e) { /* ignoré */ } }
  }
}

function surPleinEcran() {
  var actif = !!elementPleinEcran();
  var b = $('b-plein');
  if (b) { b.classList.toggle('actif', actif); b.textContent = actif ? '⛶ Quitter' : '⛶ Plein écran'; }
  /* le canvas est en position:fixed inset:0 : sa taille CSS change avec le
     viewport plein écran — on redimensionne le tampon et le DPR. */
  dimensionner();
  setTimeout(dimensionner, 80);
}
document.addEventListener('fullscreenchange', surPleinEcran);
document.addEventListener('webkitfullscreenchange', surPleinEcran);

/* Lancée par l'app du Dock (URL ?app=1), la page s'ouvre dans une fenêtre
   maximisée SANS barres. Un navigateur interdit le plein écran sans geste :
   on l'arme donc au TOUT PREMIER clic ou appui de touche, une seule fois.
   Ainsi il n'y a qu'UN seul plein écran (HTML5), et le bouton F le contrôle
   vraiment — plus de conflit avec un plein écran natif de fenêtre. */
(function armerPleinEcranApp() {
  if (!/[?&]app=1\b/.test(location.search)) return;
  var fait = false;
  function entrer() {
    if (fait) return; fait = true;
    document.removeEventListener('pointerdown', entrer, true);
    document.removeEventListener('keydown', entrer, true);
    if (!elementPleinEcran()) {
      var el = document.documentElement;
      var d = el.requestFullscreen || el.webkitRequestFullscreen;
      if (d) { try { d.call(el); } catch (e) { /* ignoré */ } }
    }
  }
  document.addEventListener('pointerdown', entrer, true);
  document.addEventListener('keydown', entrer, true);
})();

function majIndicPause() {
  var e = $('rot-etat'); if (e) e.textContent = etat.pauseRot ? ' ⏸' : '';
  var lg = $('lig-rot'); if (lg) lg.classList.toggle('pause', etat.pauseRot);
}

function basculerPause() {
  etat.pauseRot = !etat.pauseRot;
  majIndicPause();
  toast(etat.pauseRot ? 'Rotation en pause' : 'Rotation relancée');
  reveiller();
}

/* ================================================================ démarrage */

var reglages = chargerReglages();

function appliquerReglages() {
  var p = new URLSearchParams(location.search);
  var layURL = p.get('layout');
  if (reglages) {
    if (reglages.vue) etat.vue = reglages.vue;
    if (typeof reglages.rotation === 'number') etat.rotation = reglages.rotation;
    if (typeof reglages.noms === 'boolean') etat.noms = reglages.noms;
    if (typeof reglages.ressorts === 'number') etat.ressorts = reglages.ressorts;
    if (typeof reglages.taille === 'number') etat.taille = reglages.taille;
    if (reglages.replies) etat.replies = reglages.replies;
    if (typeof reglages.angle === 'number') etat.angle = reglages.angle;
    if (reglages.layout) { etat.layout = reglages.layout; etat.layoutPrec = reglages.layout; }
  }
  if (layURL && ['force', 'circle', 'hex', 'rings'].indexOf(layURL) >= 0) {
    etat.layout = layURL; etat.layoutPrec = layURL;
  }
  /* Paramètres de captures / démonstrations :
     ?rot=0.6  fixe l'angle de rotation du plan (radians) ;
     ?spin=0   arrête la rotation automatique pour une image reproductible. */
  var nb = function (cle) {
    var v = parseFloat(p.get(cle));
    return isNaN(v) ? null : v;
  };
  var vRot = nb('rot'); if (vRot !== null) etat.angle = vRot;
  var vSpin = nb('spin'); if (vSpin !== null) etat.rotation = borner(vSpin, 0, 1);

  $('s-rot').value = etat.rotation; $('v-rot').textContent = etat.rotation.toFixed(2).replace('.', ',');
  $('s-res').value = etat.ressorts; $('v-res').textContent = etat.ressorts.toFixed(2).replace('.', ',');
  $('s-tai').value = etat.taille; $('v-tai').textContent = etat.taille.toFixed(2).replace('.', ',');
  $('c-noms').checked = etat.noms;
  var b = $('layouts').getElementsByTagName('button'), i;
  for (i = 0; i < b.length; i++) b[i].classList.toggle('actif', b[i].getAttribute('data-lay') === etat.layout);
  for (i = 0; i < bv.length; i++) bv[i].classList.toggle('actif', bv[i].getAttribute('data-vue') === etat.vue);
}

function cadrageInitial() {
  if (reglages && typeof reglages.zoom === 'number') {
    etat.zoom = reglages.zoom; etat.camx = reglages.camx || 0; etat.camy = reglages.camy || 0;
    etat.zoomC = etat.zoom; etat.camxC = etat.camx; etat.camyC = etat.camy;
    majZoomBase();
  } else {
    cadrerSurContenu(false);
  }
}

function echec(txt) {
  $('vide').style.display = 'flex';
  $('vide-txt').innerHTML = txt;
}

function demarrer(g, c) {
  if (!g || !g.nodes) { echec('Graphe illisible.'); return; }
  appliquerReglages();
  construire(g, c);
  majCompteurBrouillons();
  genererEtoiles();
  dimensionner();
  cadrageInitial();
  etat.chaudJusqua = performance.now() + 5000;
  reveiller();
  boucler();
}

window.addEventListener('resize', dimensionner);
document.addEventListener('visibilitychange', function () { if (!document.hidden) reveiller(); });

if (MODE === 'relie') {
  apiGet('/api/graph', null, function (g) {
    apiGet('/api/layers', null, function (c) { demarrer(g, c); },
      function () { demarrer(g, { applications: [], routines: [], skills: [] }); });
  }, function (s) {
    if (HORS_LIGNE) { MODE = 'degrade'; demarrer(HORS_LIGNE.graph, HORS_LIGNE.layers); }
    else echec('Le serveur a refusé <code>/api/graph</code> (' + s + ').');
  });
} else if (MODE === 'degrade') {
  demarrer(HORS_LIGNE.graph, HORS_LIGNE.layers);
} else {
  echec(
    'Cette page a besoin de données. Ouvrir la console via <code>node UI/server.js</code>, ' +
    'ou générer l’instantané hors-ligne avec <code>node UI/server.js --snapshot</code> ' +
    'puis rouvrir <code>UI/univers.html</code> en double-clic.'
  );
}

})();
