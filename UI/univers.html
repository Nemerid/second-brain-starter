<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second cerveau — univers</title>
<!--
  Vue « Univers » : le second cerveau vu comme un système stellaire.

  MÊME CONTRAINTE STRUCTURANTE QUE index.html — cette page doit fonctionner DEUX FOIS.
    1. servie par UI/server.js  → mode « relié » : XHR sur /api/*, jeton X-Brain-Token.
    2. ouverte en double-clic   → mode « dégradé » : tout vient de window.__BRAIN__
                                  (écrit par `node UI/server.js --snapshot`).
  Une page file:// a une origine opaque : ni fetch(), ni type="module", ni import.
  D'où : aucun fetch, aucun module, uniquement des <script src> classiques et XHR.
  Aucune bibliothèque : le rendu est du canvas 2D écrit à la main.

  Composition (rayons en unités de monde) :
    0                CLAUDE.md, le noyau
    104 · 136 · 168  anneaux SKILLS (étoiles à 4 branches, orange)
    215 → 520        zone MÉMOIRE (galaxies de fiches, une par source ou par dossier)
    600              anneau ROUTINES (planètes dorées à satellite)
    700              anneau APPLICATIONS (hexagones facettés, un par connecteur MCP)

  CARTE 2D À PLAT — pas de volume, pas de perspective.
    · chaque nœud est un point (x, y) du plan ; aucun z, aucune projection
      perspective, aucune décroissance de taille avec la distance ;
    · les galaxies sont des amas PLATS, les anneaux des cercles vus DE FACE ;
    · un SEUL angle (etat.angle) fait pivoter tout le disque autour de son
      centre, dans le plan de l'écran : rotation AUTOMATIQUE lente (curseur
      Rotation) ou À LA MAIN (Maj+glisser / clic droit, qui met l'auto en pause).
      Le glisser gauche panoramique, la molette zoome vers le curseur.
  Tout est NET : plus de plan focal, plus de bokeh, plus de brouillard.
  Effets 2D conservés : impulsions le long des filaments, ciel d'étoiles à
  parallaxe + scintillement + étoile filante, respiration des galaxies (±2 %),
  transitions de disposition en vague, halo pulsant sur sélection, montée au
  survol. Halos PRÉ-RENDUS en sprites : jamais de `ctx.filter`, jamais de
  `shadowBlur` par nœud.
-->
<style>
  :root{
    --fond:#05060a; --verre:rgba(13,17,26,.86); --bord:rgba(126,168,216,.18);
    --texte:#e6ecf5; --doux:#9fb0cb; --faible:#5f6f8c;
    --orange:#ff9d4d; --or:#e8c268; --violet:#a78bfa; --acier:#7ea8d8; --vert:#4ade80;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--fond); color:var(--texte); overflow:hidden;
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas#ciel{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
  canvas#ciel.tire{cursor:grabbing}
  button,input,select{font:inherit;color:inherit}

  /* --------------------------------------------------------------- entête */
  .entete{
    position:fixed;top:14px;left:18px;z-index:7;display:flex;align-items:center;gap:11px;
    pointer-events:none;
  }
  .entete .logo{width:26px;height:29px;flex:0 0 auto;opacity:.95}
  .entete .txt b{
    display:block;font-size:13px;font-weight:700;letter-spacing:3.4px;
    text-shadow:0 1px 14px #000;
  }
  .entete .txt span{
    display:block;font-size:9.5px;letter-spacing:1.4px;color:var(--faible);margin-top:2px;
  }
  .entete a{pointer-events:auto}
  a.retour{
    position:fixed;top:17px;left:250px;z-index:7;
    display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:8px;
    text-decoration:none;color:var(--doux);font-size:11.5px;
    background:var(--verre);border:1px solid var(--bord);backdrop-filter:blur(9px);
  }
  a.retour:hover{color:var(--texte);border-color:rgba(126,168,216,.45)}

  /* ------------------------------------------------------------- panneau */
  .panneau{
    position:fixed;top:14px;right:14px;width:262px;z-index:6;
    background:var(--verre);border:1px solid var(--bord);border-radius:12px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 18px 50px rgba(0,0,0,.6);padding:12px;
  }
  .panneau .sec{
    font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faible);
    margin:13px 0 6px;
  }
  .panneau .sec:first-child{margin-top:2px}
  #q{
    width:100%;background:rgba(6,9,15,.75);border:1px solid var(--bord);border-radius:8px;
    padding:8px 10px;color:var(--texte);outline:none;font-size:12px;
  }
  #q:focus{border-color:rgba(255,157,77,.55);box-shadow:0 0 0 3px rgba(255,157,77,.08)}
  #q::placeholder{color:#54617a}
  .rang{display:flex;gap:5px}
  .rang.deux > *{flex:1 1 0}
  .bt{
    flex:1 1 auto;padding:6px 4px;border-radius:7px;cursor:pointer;font-size:11.5px;
    background:rgba(255,255,255,.045);border:1px solid transparent;color:var(--doux);
    transition:background .12s,color .12s,border-color .12s;white-space:nowrap;
  }
  .bt:hover{background:rgba(255,255,255,.1);color:var(--texte)}
  .bt:disabled{opacity:.35;cursor:default}
  .bt.actif{background:#e9edf5;color:#0a0d14;font-weight:600}
  .bt.contour{border-color:rgba(255,157,77,.5);color:var(--orange);background:transparent}
  .bt.contour:hover{background:rgba(255,157,77,.12)}
  .lig{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--doux);margin:11px 0 3px}
  .lig .val{color:var(--orange);font-variant-numeric:tabular-nums;font-size:11px}
  input[type=range]{-webkit-appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:#2a3346;border-radius:2px}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--orange);
    margin-top:-4.5px;box-shadow:0 0 8px rgba(255,157,77,.55);
  }
  .coche{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--doux);margin:11px 0 2px;cursor:pointer}
  .coche input{accent-color:var(--orange)}
  .compte{margin-top:11px;font-size:10.5px;color:var(--faible);letter-spacing:.2px;line-height:1.5}

  /* ------------------------------------------------------ carte de survol */
  .survol{
    position:fixed;z-index:8;pointer-events:none;opacity:0;transform:translateY(3px);
    transition:opacity .1s;max-width:300px;padding:8px 11px;border-radius:9px;
    background:rgba(10,14,22,.92);border:1px solid var(--bord);backdrop-filter:blur(10px);
    box-shadow:0 12px 34px rgba(0,0,0,.7);font-size:12px;
  }
  .survol.on{opacity:1;transform:none}
  .survol b{display:block;font-weight:600;margin-bottom:3px;line-height:1.3}
  .survol .m{color:var(--doux);font-size:10.5px}
  .survol .aide{color:var(--faible);font-size:10px;margin-top:4px;letter-spacing:.2px}

  /* --------------------------------------------- fiche d'inspection (haut G) */
  .fiche{
    position:fixed;top:78px;left:18px;width:298px;z-index:7;
    opacity:0;visibility:hidden;pointer-events:none;
    transform:translateX(-16px) scale(.982);
    transition:opacity .19s ease-out,
               transform .3s cubic-bezier(.18,.86,.32,1),
               visibility .3s;
    background:var(--verre);border:1px solid var(--bord);border-radius:12px;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 22px 60px rgba(0,0,0,.72);padding:12px 13px 13px;
  }
  .fiche.on{opacity:1;visibility:visible;pointer-events:auto;transform:none}
  .fiche h2{margin:0 22px 8px 0;font-size:12.5px;font-weight:600;line-height:1.35;word-break:break-word}
  .badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .badge{
    display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:999px;
    font-size:10px;border:1px solid currentColor;opacity:.95;
  }
  .badge i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
  .meta{font-size:10.5px;color:var(--doux);margin-bottom:2px;font-variant-numeric:tabular-nums}
  .chemin{
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:9.5px;
    color:#586780;word-break:break-all;margin-bottom:10px;line-height:1.5;
  }
  .fiche .acts{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
  .fiche .acts .bt{flex:1 1 auto;padding:5px 7px;border:1px solid var(--bord);font-size:10.5px}
  .cnx-titre{
    font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faible);
    margin:12px 0 6px;
  }
  .cnx{max-height:190px;overflow:auto;margin:0 -4px}
  .cnx button{
    display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:0;
    background:transparent;padding:4px 5px;border-radius:6px;cursor:pointer;
    font-size:11px;color:var(--doux);
  }
  .cnx button:hover{background:rgba(255,255,255,.07);color:var(--texte)}
  .cnx i{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
  .cnx span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fermer{
    position:absolute;top:8px;right:9px;width:20px;height:20px;border:0;border-radius:6px;
    background:transparent;color:var(--faible);cursor:pointer;line-height:1;font-size:15px;
  }
  .fermer:hover{background:rgba(255,255,255,.08);color:var(--texte)}

  /* ------------------------------------------------------------- messages */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
    background:rgba(12,16,25,.94);border:1px solid var(--bord);border-radius:999px;
    padding:7px 18px;font-size:11.5px;color:var(--doux);opacity:0;
    transition:opacity .16s,transform .16s;z-index:9;pointer-events:none;
  }
  .toast.on{opacity:1;transform:translateX(-50%)}
  .vide{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:4;text-align:center;padding:30px;color:var(--doux);
  }
  .vide div{max-width:470px;line-height:1.65}
  .vide code{
    font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--orange);
    background:rgba(255,157,77,.09);padding:2px 6px;border-radius:5px;
  }

  /* --------------------------------------------------- indicateur de pause */
  .lig.pause > span:first-child{opacity:.42}
  #rot-etat{color:var(--or);font-weight:600}

  /* -------------------------------------------------- fil d'ariane (drill) */
  .fildariane{
    position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-6px);z-index:8;
    display:flex;align-items:center;gap:2px;flex-wrap:wrap;max-width:56vw;
    background:var(--verre);border:1px solid var(--bord);border-radius:10px;
    padding:5px 10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .2s,transform .2s,visibility .2s;box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  .fildariane.on{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%)}
  .fildariane button{
    border:0;background:transparent;color:var(--doux);cursor:pointer;font-size:11.5px;
    padding:2px 6px;border-radius:6px;white-space:nowrap;
  }
  .fildariane button:hover{background:rgba(255,255,255,.08);color:var(--texte)}
  .fildariane button:last-of-type{color:var(--orange);font-weight:600}
  .fildariane .sep{color:var(--faible);font-size:10px}

  /* ---------------------------------------------------------- liseuse (lecture) */
  .liseuse{
    position:fixed;top:14px;left:14px;bottom:14px;z-index:8;
    width:clamp(340px,44vw,600px);display:flex;flex-direction:column;
    background:var(--verre);border:1px solid var(--bord);border-radius:14px;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 24px 70px rgba(0,0,0,.72);
    opacity:0;visibility:hidden;pointer-events:none;
    transform:translateX(-18px) scale(.99);
    transition:opacity .2s ease-out,
               transform .32s cubic-bezier(.18,.86,.32,1),visibility .32s;
  }
  .liseuse.on{opacity:1;visibility:visible;pointer-events:auto;transform:none}
  .lz-tete{padding:14px 16px 11px;border-bottom:1px solid var(--bord);position:relative;flex:0 0 auto}
  .lz-tete h2{margin:0 26px 7px 0;font-size:15px;font-weight:650;line-height:1.3;word-break:break-word}
  .lz-badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
  /* Bandeau « brouillon » de la liseuse : ambre franc, impossible à manquer. */
  .lz-brouillon{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    margin:2px 0 8px;padding:7px 10px;border-radius:9px;
    background:rgba(232,194,104,.14);border:1px solid rgba(232,194,104,.5)}
  .lz-brouillon-txt{font-size:10.5px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;color:#f0cd77}
  .lz-brouillon .bt{margin-left:auto;flex:0 0 auto;padding:5px 11px;font-size:10.5px;
    font-weight:650;color:#0b0e14;background:#e8c268;border:1px solid #e8c268;border-radius:7px;cursor:pointer}
  .lz-brouillon .bt:hover{background:#f0d488;border-color:#f0d488}
  .lz-brouillon .bt:disabled{opacity:.55;cursor:default}
  /* Compteur flottant « N brouillons » : discret, cliquable pour les lister. */
  .brouillons-pill{position:fixed;top:14px;right:14px;z-index:7;
    padding:6px 12px;border-radius:999px;font-size:11px;font-weight:650;
    color:#f0cd77;background:rgba(232,194,104,.12);border:1px solid rgba(232,194,104,.5);
    cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .brouillons-pill:hover{background:rgba(232,194,104,.22)}
  .lz-meta{font-size:10.5px;color:var(--doux);font-variant-numeric:tabular-nums;margin-bottom:3px}
  .lz-chemin{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:9.5px;color:#586780;word-break:break-all}
  .lz-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .lz-acts .bt{flex:0 1 auto;padding:5px 9px;border:1px solid var(--bord);font-size:10.5px}
  .lz-corps{flex:1 1 auto;overflow:auto;padding:14px 18px 22px;font-size:13.5px;line-height:1.62;color:#dbe3f0}
  .lz-corps::-webkit-scrollbar{width:9px}
  .lz-corps::-webkit-scrollbar-thumb{background:rgba(126,168,216,.2);border-radius:6px}
  .lz-charge{color:var(--faible);font-size:12px}
  .lz-corps h1,.lz-corps h2,.lz-corps h3,.lz-corps h4,.lz-corps h5,.lz-corps h6{
    line-height:1.28;font-weight:650;color:#f0f5fc;margin:1.25em 0 .5em}
  .lz-corps h1{font-size:1.5em}
  .lz-corps h2{font-size:1.26em;border-bottom:1px solid rgba(126,168,216,.15);padding-bottom:.2em}
  .lz-corps h3{font-size:1.12em;color:var(--acier)}
  .lz-corps h4{font-size:1em;color:var(--doux)}
  .lz-corps p{margin:.55em 0}
  .lz-corps ul,.lz-corps ol{margin:.5em 0;padding-left:1.45em}
  .lz-corps li{margin:.24em 0}
  .lz-corps strong{color:#fff;font-weight:660}
  .lz-corps em{color:#e7d9ff;font-style:italic}
  .lz-corps del{color:var(--faible)}
  .lz-corps code{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:.86em;
    background:rgba(126,168,216,.14);padding:1px 5px;border-radius:4px;color:#cfe0f5}
  .lz-corps pre{background:rgba(6,9,15,.72);border:1px solid var(--bord);border-radius:9px;
    padding:11px 13px;overflow-x:auto;margin:.8em 0}
  .lz-corps pre code{background:none;padding:0;font-size:.82em;color:#c4d4ea;line-height:1.5}
  .lz-corps blockquote{margin:.7em 0;padding:.15em 0 .15em 13px;border-left:3px solid rgba(126,168,216,.4);color:var(--doux)}
  .lz-corps hr{border:0;border-top:1px solid rgba(126,168,216,.18);margin:1.3em 0}
  .lz-corps a{color:#8fb8ea;text-decoration:none;border-bottom:1px solid rgba(143,184,234,.35)}
  .lz-corps a:hover{color:#bcd6f7}
  .lz-corps a.wl{color:var(--violet);border-bottom:1px dashed rgba(167,139,250,.55);cursor:pointer}
  .lz-corps a.wl:hover{color:#c9b6ff;background:rgba(167,139,250,.12)}
  .lz-corps .wl.cassee{color:#f87171;border-bottom:1px dashed rgba(248,113,113,.5);cursor:not-allowed}
  .lz-corps table{border-collapse:collapse;width:100%;margin:.9em 0;font-size:.9em;display:block;overflow-x:auto}
  .lz-corps th,.lz-corps td{border:1px solid rgba(126,168,216,.2);padding:6px 9px;text-align:left;vertical-align:top}
  .lz-corps thead th{background:rgba(126,168,216,.12);color:#eaf1fb;font-weight:600}
  .lz-corps tbody tr:nth-child(even){background:rgba(126,168,216,.045)}
  .lz-corps .callout{margin:.9em 0;padding:9px 13px;border-radius:9px;border:1px solid rgba(126,168,216,.4);
    border-left-width:3px;background:rgba(126,168,216,.06)}
  .lz-corps .callout-t{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:4px}
  .lz-corps .callout-warning,.lz-corps .callout-caution{border-color:rgba(232,194,104,.5);background:rgba(232,194,104,.08)}
  .lz-corps .callout-warning .callout-t,.lz-corps .callout-caution .callout-t{color:var(--or)}
  .lz-corps .callout-note .callout-t,.lz-corps .callout-info .callout-t{color:var(--acier)}
  .lz-corps .callout-tip{border-color:rgba(74,222,128,.5);background:rgba(74,222,128,.07)}
  .lz-corps .callout-tip .callout-t{color:var(--vert)}
  .lz-corps .callout-important{border-color:rgba(167,139,250,.55);background:rgba(167,139,250,.08)}
  .lz-corps .callout-important .callout-t{color:var(--violet)}
  .lz-tronque{margin-top:14px;font-size:10.5px;color:var(--faible);font-style:italic}
  .lz-pdf{font-size:11px;color:var(--doux);margin-bottom:8px}
  .lz-extrait{white-space:pre-wrap;font-size:.85em;color:#c4d4ea}
  .lz-vide{color:var(--faible)}
  .lz-back{flex:0 0 auto;border-top:1px solid var(--bord);padding:10px 14px 12px;max-height:148px;overflow:auto}
  .lz-back .t{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faible);margin-bottom:6px}
  .lz-back button{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:0;
    background:transparent;padding:4px 5px;border-radius:6px;cursor:pointer;font-size:11px;color:var(--doux)}
  .lz-back button:hover{background:rgba(255,255,255,.07);color:var(--texte)}
  .lz-back i{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
  .lz-back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  body.lecture .fiche{opacity:0!important;visibility:hidden!important;pointer-events:none!important}

  /* ---------------------------------------------- panneau de résultats (recherche) */
  .resultats{
    position:fixed;top:56px;right:14px;width:262px;z-index:8;
    max-height:calc(100vh - 78px);overflow-y:auto;overflow-x:hidden;
    background:var(--verre);border:1px solid var(--bord);border-radius:12px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 18px 50px rgba(0,0,0,.6);padding:6px;display:none;
  }
  .resultats.on{display:block}
  .resultats::-webkit-scrollbar{width:9px}
  .resultats::-webkit-scrollbar-thumb{background:rgba(126,168,216,.2);border-radius:6px}
  .res-tete{
    font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--faible);
    padding:5px 7px 6px;
  }
  .res-tete.faible{color:var(--or)}
  .res{
    display:block;width:100%;text-align:left;border:1px solid transparent;
    background:transparent;cursor:pointer;padding:7px 8px;border-radius:8px;color:var(--doux);
  }
  .res:hover{background:rgba(255,255,255,.06)}
  .res.sel{background:rgba(255,157,77,.12);border-color:rgba(255,157,77,.4)}
  .res-t{display:flex;align-items:center;gap:6px;margin-bottom:3px}
  .res-badge{
    display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;max-width:118px;
    font-size:9px;padding:1px 7px;border-radius:999px;border:1px solid currentColor;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .res-badge i{width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 auto}
  .res-titre{
    flex:1 1 auto;font-size:11.5px;color:var(--texte);font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .res-score{font-size:9.5px;color:var(--faible);font-variant-numeric:tabular-nums;flex:0 0 auto}

<script>
'use strict';
(function () {

/* ========================================================= socle & transport */

var SERVI = location.protocol === 'http:' || location.protocol === 'https:';
var JETON = (window.__BRAIN_SESSION__ && window.__BRAIN_SESSION__.token) || '';
var HORS_LIGNE = window.__BRAIN__ || null;
var MODE = SERVI ? 'relie' : (HORS_LIGNE ? 'degrade' : 'orphelin');

/** XHR — jamais fetch : une page file:// ne sait pas fetcher son voisin. */
function apiGet(chemin, params, ok, ko) {
  var q = [], k;
  for (k in params) if (params[k] !== undefined && params[k] !== null) {
    q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
  }
  var x = new XMLHttpRequest();
  x.open('GET', chemin + (q.length ? '?' + q.join('&') : ''), true);
  x.setRequestHeader('X-Brain-Token', JETON);
  x.onload = function () {
    var d = null;
    try { d = JSON.parse(x.responseText); } catch (e) { d = null; }
    if (x.status >= 200 && x.status < 300) ok(d); else if (ko) ko(x.status, d);
  };
  x.onerror = function () { if (ko) ko(0, null); };
  x.send();
}

function apiPost(chemin, corps, ok, ko) {
  var x = new XMLHttpRequest();
  x.open('POST', chemin, true);
  x.setRequestHeader('X-Brain-Token', JETON);
  x.setRequestHeader('Content-Type', 'application/json');
  x.onload = function () {
    var d = null;
    try { d = JSON.parse(x.responseText); } catch (e) { d = null; }
    if (x.status >= 200 && x.status < 300) ok(d); else if (ko) ko(x.status, d);
  };
  x.onerror = function () { if (ko) ko(0, null); };
  x.send(JSON.stringify(corps));
}

function $(id) { return document.getElementById(id); }

var minuterieToast = null;
function toast(m) {
  var t = $('toast');
  t.textContent = m; t.classList.add('on');
  if (minuterieToast) clearTimeout(minuterieToast);
  minuterieToast = setTimeout(function () { t.classList.remove('on'); }, 2200);
}

/* ============================================================== géométrie */

var R_SKILL = [62, 84, 106];
var R_MEM0 = 150;
var RA = { mem1: 520, routines: 660, apps: 840 };   // rayons effectifs des couches
var R_SCENE = 800;
var TAU = Math.PI * 2;

function alea(graine) {
  var t = graine >>> 0;
  return function () {
    t += 0x6D2B79F5;
    var r = Math.imul(t ^ (t >>> 15), 1 | t);
    r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}

function hexRgba(hex, a) {
  var h = String(hex || '#8899aa').replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  var n = parseInt(h, 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

function eclaircir(hex, d) {
  var h = String(hex).replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  var n = parseInt(h, 16), k = d === undefined ? 55 : d;
  return 'rgb(' + Math.min(255, ((n >> 16) & 255) + k) + ',' +
    Math.min(255, ((n >> 8) & 255) + k) + ',' + Math.min(255, (n & 255) + k) + ')';
}

function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

/** Ressort léger : file droit vers 1 avec un très petit dépassement. */
function ressort(t) {
  if (t <= 0) return 0;
  if (t >= 1) return 1;
  return 1 - Math.pow(2, -7.4 * t) * Math.cos(t * 7.6);
}

function borner(v, a, b) { return v < a ? a : (v > b ? b : v); }

function courtLabel(s, n) {
  s = String(s || '');
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

function nomFichier(id) { var p = String(id || '').split('/'); return p[p.length - 1]; }

function octetsFr(n) {
  if (!n && n !== 0) return '—';
  if (n < 1024) return n + ' o';
  if (n < 1048576) return (n / 1024).toFixed(1).replace('.', ',') + ' Ko';
  return (n / 1048576).toFixed(1).replace('.', ',') + ' Mo';
}

function ageFr(iso) {
  if (!iso) return null;
  var d = new Date(iso);
  if (isNaN(d)) return null;
  var j = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (j <= 0) return 'aujourd’hui';
  if (j === 1) return 'hier';
  if (j < 60) return 'il y a ' + j + ' j';
  if (j < 730) return 'il y a ' + Math.round(j / 30) + ' mois';
  return 'il y a ' + Math.round(j / 365) + ' ans';
}

/* ================================================================== état */

var etat = {
  layout: 'circle', layoutPrec: 'circle', transT0: -1e9, transFin: 0,
  vue: 'sources',
  rotation: 0.35, noms: false, ressorts: 0.38, taille: 1,
  zoom: 0.55, camx: 0, camy: 0, zoomBase: 0.55,
  /* orientation de la scène : un SEUL angle. La carte est plate ; `angle`

  angle: 0,
